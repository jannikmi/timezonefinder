name: Resolve the automated data update PR
description: >
  Resolve the PR a completed workflow_run belongs to and prove it is the update
  PR this repository's own automation opened. The identity check is what stops
  a fork branch named data-update-* from reaching the merge step, so every
  consumer runs this one rather than its own copy.

inputs:
  pr-number:
    description: >
      github.event.workflow_run.pull_requests[0].number. May be empty - GitHub
      does not populate that array for every run - hence the branch fallback.
    required: false
    default: ""
  branch:
    description: github.event.workflow_run.head_branch
    required: true
  head-sha:
    description: >
      github.event.workflow_run.head_sha. A PR that has moved past it makes
      this run superseded, which is a no-op rather than an error.
    required: true
  repo-owner:
    description: github.repository_owner - the only owner a head repository may have
    required: true
  repo:
    description: github.repository
    required: true
  token:
    description: token used for the `gh` lookups
    required: true

outputs:
  found:
    description: >
      'true' when an open, matching update PR exists. Consumers must gate on
      it rather than assume a PR number is present.
    value: ${{ steps.resolve.outputs.found }}
  pr-number:
    description: number of the resolved update PR, empty unless found is 'true'
    value: ${{ steps.resolve.outputs.pr-number }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BRANCH: ${{ inputs.branch }}
        HEAD_SHA: ${{ inputs.head-sha }}
        REPO_OWNER: ${{ inputs.repo-owner }}
      run: |
        set -euo pipefail

        nothing_to_do() {
          echo "$1"
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "pr-number=" >> "$GITHUB_OUTPUT"
          exit 0
        }

        pr_number="$PR_NUMBER"
        if [[ -z "$pr_number" ]]; then
          # workflow_run.pull_requests is empty in more cases than it is
          # documented to be, and there is no signal distinguishing "no PR" from
          # "PR not reported". Fall back to the branch the run was for; the
          # identity check below still has to pass either way.
          echo "workflow_run payload carried no PR number, looking up $BRANCH"
          pr_number=$(gh pr list --state open --base master --head "$BRANCH" \
            --json number --jq '.[0].number // empty')
        fi
        if [[ -z "$pr_number" ]]; then
          nothing_to_do "no open update PR for branch $BRANCH, nothing to do"
        fi

        pr_data=$(gh pr view "$pr_number" \
          --json state,baseRefName,headRefName,headRefOid,headRepositoryOwner)
        pr_state=$(jq -r .state <<<"$pr_data")
        base_branch=$(jq -r .baseRefName <<<"$pr_data")
        head_branch=$(jq -r .headRefName <<<"$pr_data")
        head_sha=$(jq -r .headRefOid <<<"$pr_data")
        head_owner=$(jq -r .headRepositoryOwner.login <<<"$pr_data")
        # identity first: a PR that is not ours is an error whatever its state
        if [[ "$base_branch" != "master" || "$head_branch" != "$BRANCH" || \
              "$head_owner" != "$REPO_OWNER" ]]; then
          echo "::error::PR #$pr_number does not match the update PR this run was for" \
            "(base=$base_branch head=$head_branch owner=$head_owner)"
          exit 1
        fi

        # ours, but this run is no longer the current one. build.yml declares
        # no concurrency group, so a run for an older head finishes after a
        # push instead of being cancelled. Acting on it would merge or report a
        # commit the PR has moved past - wrong, but not an error: the run for
        # the new head does the work. Failing here would instead cost the alert
        # job its comment, the only place a failed CI run is reported.
        if [[ "$head_sha" != "$HEAD_SHA" ]]; then
          nothing_to_do "PR #$pr_number is at $head_sha, this run was for $HEAD_SHA, nothing to do"
        fi

        # ours, but already dealt with - a re-run of build.yml on a merged or
        # closed update PR lands here and must not fail the workflow
        if [[ "$pr_state" != "OPEN" ]]; then
          nothing_to_do "update PR #$pr_number is $pr_state, nothing to do"
        fi

        echo "resolved update PR #$pr_number"
        echo "found=true" >> "$GITHUB_OUTPUT"
        echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
