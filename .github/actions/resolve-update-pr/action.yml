name: Resolve the automated data update PR
description: >
  Resolve the pull request a completed workflow_run belongs to and prove it is
  the update PR this repository's own automation opened, before any step merges
  it, labels it or comments on it. The identity check is what stops a fork
  branch named data-update-* from reaching the merge step, so every consumer
  runs the same one rather than its own copy.

  Two outcomes are deliberately kept apart. A PR that exists but does not match
  - wrong base, wrong head, a head repository outside this owner - is an error.
  A PR that is absent or no longer open is "nothing to do" (found=false,
  success): re-running build.yml on an already-merged update PR re-fires
  workflow_run, and that has to stay the no-op it was rather than failing the
  workflow and burying the real notifications under a false alarm.

inputs:
  pr-number:
    description: >
      github.event.workflow_run.pull_requests[0].number. May be empty - GitHub
      does not populate that array for every run - so the branch lookup in the
      step below is the fallback rather than the only path.
    required: false
    default: ""
  branch:
    description: github.event.workflow_run.head_branch
    required: true
  head-sha:
    description: github.event.workflow_run.head_sha
    required: true
  repo-owner:
    description: github.repository_owner - the only owner a head repository may have
    required: true
  repo:
    description: github.repository
    required: true
  token:
    description: token used for the `gh` lookups
    required: true

outputs:
  found:
    description: >
      'true' when an open, matching update PR exists. Anything else means there
      is nothing to act on - consumers must gate on it rather than assuming a
      PR number is present.
    value: ${{ steps.resolve.outputs.found }}
  pr-number:
    description: number of the resolved update PR, empty unless found is 'true'
    value: ${{ steps.resolve.outputs.pr-number }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BRANCH: ${{ inputs.branch }}
        HEAD_SHA: ${{ inputs.head-sha }}
        REPO_OWNER: ${{ inputs.repo-owner }}
      run: |
        set -euo pipefail

        nothing_to_do() {
          echo "$1"
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "pr-number=" >> "$GITHUB_OUTPUT"
          exit 0
        }

        pr_number="$PR_NUMBER"
        if [[ -z "$pr_number" ]]; then
          # workflow_run.pull_requests is empty in more cases than it is
          # documented to be, and there is no signal distinguishing "no PR" from
          # "PR not reported". Fall back to the branch the run was for; the
          # identity check below still has to pass either way.
          echo "workflow_run payload carried no PR number, looking up $BRANCH"
          pr_number=$(gh pr list --state open --base master --head "$BRANCH" \
            --json number --jq '.[0].number // empty')
        fi
        if [[ -z "$pr_number" ]]; then
          nothing_to_do "no open update PR for branch $BRANCH, nothing to do"
        fi

        pr_data=$(gh pr view "$pr_number" \
          --json state,baseRefName,headRefName,headRefOid,headRepositoryOwner)
        pr_state=$(jq -r .state <<<"$pr_data")
        base_branch=$(jq -r .baseRefName <<<"$pr_data")
        head_branch=$(jq -r .headRefName <<<"$pr_data")
        head_sha=$(jq -r .headRefOid <<<"$pr_data")
        head_owner=$(jq -r .headRepositoryOwner.login <<<"$pr_data")
        # identity first: a PR that is not ours is an error whatever its state
        if [[ "$base_branch" != "master" || "$head_branch" != "$BRANCH" || \
              "$head_sha" != "$HEAD_SHA" || "$head_owner" != "$REPO_OWNER" ]]; then
          echo "::error::PR #$pr_number does not match the update PR this run was for" \
            "(base=$base_branch head=$head_branch@$head_sha owner=$head_owner)"
          exit 1
        fi

        # ours, but already dealt with - a re-run of build.yml on a merged or
        # closed update PR lands here and must not fail the workflow
        if [[ "$pr_state" != "OPEN" ]]; then
          nothing_to_do "update PR #$pr_number is $pr_state, nothing to do"
        fi

        echo "resolved update PR #$pr_number"
        echo "found=true" >> "$GITHUB_OUTPUT"
        echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
