name: Bug report
description: A wrong timezone, a crash, or behaviour that contradicts the documentation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        Please check the [existing issues](https://github.com/jannikmi/timezonefinder/issues?q=is%3Aissue) first - a wrong answer at a border is often the upstream dataset rather than this package.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the lookup return, and what did you expect instead?
      placeholder: |
        timezone_at(lng=13.358, lat=52.5061) returns 'Europe/Paris'; I expected 'Europe/Berlin'.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The smallest snippet that shows it, including the coordinates involved. This is rendered as python, no backticks needed.
      render: python
      placeholder: |
        from timezonefinder import TimezoneFinder

        tf = TimezoneFinder()
        print(tf.timezone_at(lng=13.358, lat=52.5061))
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `pip show timezonefinder timezonefinder-data | grep -i version`, plus your python version and operating system.
      placeholder: "timezonefinder 9.0.0, timezonefinder-data 2025.2, python 3.13, Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: acceleration
    attributes:
      label: Which point-in-polygon backend is in use?
      description: "`numba` takes precedence over the C extension whenever it is installed. Pick unsure if you have not checked - a wrong answer that depends on the backend is a different bug from one that does not."
      options:
        - C extension (a plain pip install)
        - numba (the numba extra is installed)
        - numpy fallback (no C extension built)
        - unsure
    validations:
      required: true
