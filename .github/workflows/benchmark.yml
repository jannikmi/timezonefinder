name: benchmark

# Continuous benchmarking. Deliberately kept separate from
# build.yml: benchmarking must never be entangled with the release/publish
# pipeline, in either direction.
#
# Triggers:
# - push to master:   record the result and update the gh-pages trend chart
# - push to release/**:
#                     render the published report suite for the pushed commit
#                     and upload it as `benchmark-pages`, so the release the
#                     branch is preparing finds an artifact stamped with its own
#                     SHA without anybody having pressed a button first. This is
#                     the *dispatch* only - CI still never commits the pages; the
#                     release consumes the artifact, exactly as it does for the
#                     data wheel and `DATA_BUILD_RUN`. A release branch is a base
#                     repository branch, so unlike the `pull_request` trigger this
#                     runs no untrusted code; it still holds no write permission,
#                     because the render job needs none. The measurement half is
#                     skipped here: a release branch's numbers must not enter the
#                     cross-machine trend chart, whose points are master commits.
# - pull_request:     measure the head *and* the merge base on the same runner
#                     and upload both as artifacts. This job runs untrusted PR
#                     code and therefore holds NO write permissions and no
#                     secrets, so it behaves identically for branch PRs and
#                     fork PRs. The comparison comment is posted by the
#                     separate, privileged benchmark-comment.yml, which is
#                     triggered by workflow_run and runs the *base* repo's
#                     workflow definition. See
#                     contributing/development/benchmarking-and-performance-validation.md.
#                     Gated by `paths`: the job is a double checkout + double
#                     `uv sync` + double C-extension build + a 2-pass timing
#                     sandwich, which is wasted on a push that cannot move the
#                     tracked numbers (docs, CI config unrelated to this file,
#                     changelog-only). Listed paths are everything that can:
#                     the package itself, the data distribution, the benchmark
#                     suite, the measurement/comparison scripts this job
#                     shells out to, the build inputs (`setup.py`,
#                     `pyproject.toml`, `uv.lock`), `Makefile` (owns the
#                     `benchmarks-ci`/`memory-ci` targets), and this file.
# - workflow_dispatch: either repeat the identical core measurement N times to
#                     characterise the runner pool's spread, or render the full
#                     published report suite on one named CI machine for a
#                     release. Both are explicit because both are expensive.
on:
  push:
    branches:
      - master
      # every release branch renders the pages the release will commit
      - "release/**"
  pull_request:
    paths:
      - "timezonefinder/**"
      - "packages/timezonefinder-data/**"
      - "benchmarks/**"
      - "scripts/**"
      - "setup.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      repetitions:
        description: >-
          How many times to repeat the identical core measurement, each on a
          fresh runner, to measure the noise floor. Minimum 5.
        required: false
        default: "5"
      render_reports:
        description: Render the published benchmark pages instead of measuring noise
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# least privilege by default; every job re-declares exactly what it needs
permissions: {}

env:
  # a charted series' *name* is the join key of its trend history, and the numba
  # and clang point-in-polygon paths are completely different implementations
  # whose numbers are not comparable. Keeping the acceleration path in the
  # suite name means a numba-tracked suite could never silently overwrite this
  # one's history - it would simply be a different chart.
  BENCHMARK_SUITE_NAME: "timezone lookup (clang, min)"
  # Threshold for the *trend chart* only, which is inherently cross-machine:
  # `ubuntu-latest` does not pin the CPU (see the `measure` job), so
  # consecutive points on the chart routinely come from different hardware.
  # DERIVED FROM MEASUREMENT: across 11 recorded scalar-core runs whose lookup
  # path was identical, the tracked min spread 134-158% (unique 134.3%, random
  # 145.9%, ambiguous 158.4%) because the pool served AMD EPYC 9V74, AMD EPYC
  # 7763 and Intel Xeon Platinum 8573C parts at 2.30-3.69 GHz. A five-run study
  # after adding the six batch cases drew the two AMD classes; its worst scalar
  # spread was 138.9% and its worst batch spread was 137.9%, so the expanded
  # set does not widen the known bound. The worst observed 158.4% spread + 20%
  # headroom rounds to 180%, per scripts/benchmark_noise.py's own rule.
  #
  # Be clear about what this buys: at 180% the chart can only catch a
  # catastrophic regression, and it is blind to the 10-30% changes that are
  # actually worth reviewing. That is not a gap to close by tightening the
  # number - a chart spanning different CPUs cannot resolve better than the
  # machines it spans. Those changes are the same-runner base/head
  # comparison's job (scripts/compare_benchmark_runs.py, run per pull
  # request), which is the meaningful gate; this one is a deliberately weak
  # backstop for master, kept because nothing else watches it. The previous
  # 110% was derived from a 5-run study that happened to draw similar
  # hardware, and would fire on unchanged code about as often as not.
  #
  # Re-derive with a workflow_dispatch noise run (see
  # contributing/development/benchmarking-and-performance-validation.md)
  # whenever the runner pool or the core set changes. `fail-on-alert` stays
  # false: master must never be blocked on which machine it drew.
  ALERT_THRESHOLD: "180%"
  # directories the two measurements are staged in before upload, and the
  # filename the head measurement is staged under inside its artifact. GitHub
  # workflows cannot import constants, so REPORT_FILENAME is repeated in
  # .github/workflows/benchmark-comment.yml; tests/test_benchmark_workflows.py
  # fails if the copies drift. The merge base's passes are consumed by glob,
  # so their filenames stay local to this file.
  REPORT_FILENAME: "benchmark-report.json"
  # the chart-shaped export of the same measurement, staged beside it
  # (see scripts/export_timing_chart_json.py)
  CHART_FILENAME: "benchmark-chart.json"
  REPORT_DIR: "benchmark-report"
  BASE_REPORT_DIR: "benchmark-base-report"
  # --- memory footprint (scripts/measure_memory.py) ---------------------------
  # A second suite in the same gh-pages data file: `dev/bench/data.js` keys its
  # entries by suite name, so this renders as its own chart on the same page
  # rather than colliding with the timing history.
  MEMORY_SUITE_NAME: "memory footprint (heap, min)"
  # Unlike the timing threshold above, this one is not fighting the runner
  # pool. The charted metrics are `tracemalloc` figures, and the same code
  # allocates the same bytes on every machine: `make memory-noise` over 5 runs
  # measured a spread of exactly 100.0% (coefficient of variation 0.0%) for all
  # six charted metrics. So the threshold is set at the floor
  # scripts/benchmark_noise.py will suggest for a zero-spread measurement,
  # which still leaves a 10% margin for an allocator difference between Python
  # builds. RSS metrics - the ones that did vary, 102-111% - are deliberately
  # not charted (see scripts/export_memory_chart_json.py).
  #
  # Re-derive from CI rather than locally if this ever fires spuriously: a
  # workflow_dispatch noise run draws a fresh runner per repetition.
  MEMORY_ALERT_THRESHOLD: "110%"
  # staged alongside the timing report inside the same artifacts. Repeated in
  # .github/workflows/benchmark-comment.yml; tests/test_benchmark_workflows.py
  # fails if the copies drift.
  MEMORY_REPORT_FILENAME: "memory-report.json"
  MEMORY_CHART_FILENAME: "memory-chart.json"

jobs:
  plan:
    name: plan repetitions
    if: ${{ !inputs.render_reports && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      repetitions: ${{ steps.plan.outputs.repetitions }}
    steps:
      # push/PR record exactly one measurement; only the noise run repeats.
      # (The repetition index is *not* a runner-image matrix: every repetition
      # asks for the same `ubuntu-latest` image. It does land on a different
      # *machine* each time, which is precisely what the noise run measures.)
      - name: Build the repetition list
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo 'repetitions=["1"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$REPETITIONS" in
            ''|*[!0-9]*) echo "repetitions must be a positive integer, got '$REPETITIONS'" >&2; exit 1 ;;
          esac
          if [ "$REPETITIONS" -lt 5 ]; then
            echo "at least 5 repetitions are needed to characterise a noise floor, got $REPETITIONS" >&2
            exit 1
          fi
          seq 1 "$REPETITIONS" | jq -R . | jq -sc . | sed 's/^/repetitions=/' >> "$GITHUB_OUTPUT"

  measure:
    name: measure (run ${{ matrix.repetition }})
    needs: [plan]
    if: ${{ !inputs.render_reports && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) }}
    # One runner *image* - and that is all `ubuntu-latest` guarantees. It does
    # NOT pin the CPU: this pool has served AMD EPYC 9V74, AMD EPYC 7763 and
    # Intel Xeon Platinum 8573C parts between 2.30 and 3.69 GHz, and the clock
    # varies run to run even within one model. On unchanged code that is worth
    # up to ~1.58x on the tracked core set, so two runs of this job are NOT
    # comparable to each other by default. Everything below follows from that:
    # a pull request measures its own merge base here, in this job, on this
    # machine, instead of comparing against a stored number from another one;
    # every run prints the CPU it drew; and the cross-machine trend chart gets
    # a threshold that reflects the spread rather than wishing it away.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `obtain-data` reads the artefacts of the run named by DATA_BUILD_RUN, which is
      # where a data-update pull request's dataset lives - PyPI has only the release
      # before it. Read-only and artefact-scoped, so this job still holds no write
      # permission and no secret while it runs untrusted pull request code.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        repetition: ${{ fromJSON(needs.plan.outputs.repetitions) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # NOTE: the `numba` group is deliberately NOT installed. The tracked
      # configuration is the no-numba / clang C extension one, which is what a
      # plain `pip install timezonefinder` gives you and what the constrained
      # container audience in contributing/core-contributor-contract.md actually runs.
      - name: Install dependencies (without numba)
        run: uv sync --group test

      # The dataset is git-ignored, and every benchmark below reads it. On a
      # data-update pull request this takes the head's data from the run that
      # compiled it, so the comparison is new data against the base's old data
      # rather than one dataset measured twice.
      - name: Obtain the packaged boundary data
        uses: ./.github/actions/obtain-data
        with:
          token: ${{ github.token }}

      # assert rather than assume: a numba dependency sneaking in via a
      # transitive dependency or a lockfile change would silently corrupt the
      # entire trend history instead of failing here
      - name: Assert the tracked acceleration path is active
        # UV_NO_SYNC: keep the environment exactly as synced above, so `uv run`
        # cannot quietly re-resolve it out from under the measurement
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          uv run python -m scripts.assert_acceleration_path \
            --expect "$(make -s print-benchmark-acceleration-path)"

      # --- the merge base, measured on this same machine (pull requests only)
      #
      # The whole point: a stored master baseline was measured on whatever CPU
      # that run drew, so comparing against it measures the runner pool, not
      # the pull request. Checking the base out here costs a second checkout,
      # a second `uv sync` and a second C extension build (~2-3 min); the
      # measurement itself is seconds.
      #
      # `base.sha` is the base branch tip the pull request event carries, and
      # the default checkout above is the `refs/pull/N/merge` result - so this
      # compares "base branch" against "base branch with this PR merged in",
      # which is exactly the change under review.
      - name: Check out the merge base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install dependencies for the merge base (without numba)
        if: github.event_name == 'pull_request'
        working-directory: base
        run: uv sync --group test

      # The base declares its own data version, which on a data-update pull request
      # is the one before the head's - so this resolves separately rather than
      # sharing the head's directory.
      - name: Obtain the merge base's packaged boundary data
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/obtain-data
        with:
          token: ${{ github.token }}
          working-directory: base

      # the same guard as for the head: a base checkout that silently fell back
      # to the pure-Python point-in-polygon path would report a ~50x
      # "improvement" instead of failing
      - name: Assert the tracked acceleration path is active in the merge base
        if: github.event_name == 'pull_request'
        working-directory: base
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          uv run python -m scripts.assert_acceleration_path \
            --expect "$(make -s print-benchmark-acceleration-path)"

      # The base is measured twice, once before and once after the head, so
      # the head sits at the midpoint of the two: a runner that drifts over
      # the job's lifetime then shows up in the base's own spread instead of
      # masquerading as a code change. scripts/compare_benchmark_runs.py
      # reduces the two passes by min, the same estimator used within a run.
      - name: Measure the merge base (pass 1 of 2)
        if: github.event_name == 'pull_request'
        working-directory: base
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          make benchmarks-ci
          mkdir -p "../$BASE_REPORT_DIR"
          cp "$(make -s print-ci-benchmark-json)" "../$BASE_REPORT_DIR/pass-1.json"

      # `make benchmarks-ci` owns the pytest invocation, the round count and
      # the estimator normalisation - see the Makefile, not this file
      - name: Run the core benchmark set
        env:
          UV_NO_SYNC: "1"
        run: make benchmarks-ci

      - name: Measure the merge base (pass 2 of 2)
        if: github.event_name == 'pull_request'
        working-directory: base
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          make benchmarks-ci
          cp "$(make -s print-ci-benchmark-json)" "../$BASE_REPORT_DIR/pass-2.json"

      # --- memory footprint, strictly after every timing measurement above
      #
      # ORDER MATTERS: the memory harness reads the whole boundary dataset,
      # which warms the OS file cache. benchmarks/test_initialization.py goes
      # out of its way to disable pytest-benchmark's warmup precisely so it can
      # measure *cold* construction, and running this first would hand it a hot
      # cache instead. Nothing below this line may move above it.
      #
      # Only one merge-base pass, unlike the two the timings need: that
      # sandwich exists to catch a runner drifting over the job's lifetime, and
      # an allocation count does not drift - `make memory-noise` measures a
      # 0.0% coefficient of variation for the charted metrics.
      - name: Measure the memory footprint
        env:
          UV_NO_SYNC: "1"
        run: make memory-ci

      - name: Measure the merge base's memory footprint
        if: github.event_name == 'pull_request'
        working-directory: base
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          # a merge base from before this harness existed has nothing to
          # measure; the comparison step below then skips too, rather than
          # failing the pull request that introduces it
          if [ ! -f scripts/measure_memory.py ]; then
            echo "::notice::merge base predates the memory harness - skipping its measurement"
            exit 0
          fi
          make memory-ci
          mkdir -p "../$BASE_REPORT_DIR"
          cp "$(make -s print-ci-memory-json)" "../$BASE_REPORT_DIR/memory-pass-1.json"

      # the Makefile owns where the report lands; the artifact exposes it under
      # a stable name so the consuming jobs don't have to know that path
      - name: Stage the report for upload
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          cp "$(make -s print-ci-benchmark-json)" "$REPORT_DIR/$REPORT_FILENAME"
          cp "$(make -s print-timing-chart-json)" "$REPORT_DIR/$CHART_FILENAME"
          cp "$(make -s print-ci-memory-json)" "$REPORT_DIR/$MEMORY_REPORT_FILENAME"
          cp "$(make -s print-memory-chart-json)" "$REPORT_DIR/$MEMORY_CHART_FILENAME"

      # which machine this run drew, in the Actions UI, without downloading an
      # artifact. Artifacts expire after 14 days; a step summary is as durable
      # as the run, and the trend chart carries the same label in its tooltip
      # (see scripts/normalize_benchmark_json.py).
      - name: Describe the runner in the job summary
        env:
          UV_NO_SYNC: "1"
          RUN_TITLE: ${{ github.event_name == 'pull_request' && 'pull request head' || github.event_name }}
        run: |
          set -euo pipefail
          uv run python -m scripts.describe_benchmark_machine \
            "$REPORT_DIR/$REPORT_FILENAME" \
            --title "$RUN_TITLE" \
            --markdown-out "$GITHUB_STEP_SUMMARY"
          uv run python -m scripts.describe_benchmark_machine \
            "$REPORT_DIR/$MEMORY_REPORT_FILENAME" \
            --title "$RUN_TITLE" \
            --metric memory \
            --markdown-out "$GITHUB_STEP_SUMMARY"

      # the same table benchmark-comment.yml posts on the pull request, but
      # available immediately in this job's own summary. This job has no write
      # permissions, so it can only report - never comment.
      - name: Compare the head against the merge base
        if: github.event_name == 'pull_request'
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          # `pass-*` rather than `*`: the merge base directory also holds the
          # memory report, which is compared separately below and would
          # otherwise be fed into the duration comparison
          uv run python -m scripts.compare_benchmark_runs \
            --base "$BASE_REPORT_DIR"/pass-*.json \
            --head "$REPORT_DIR/$REPORT_FILENAME" \
            --markdown-out "$GITHUB_STEP_SUMMARY"

      - name: Compare the head's memory against the merge base
        if: github.event_name == 'pull_request'
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          base_reports=("$BASE_REPORT_DIR"/memory-pass-*.json)
          if [ ${#base_reports[@]} -eq 0 ]; then
            echo "::notice::no merge base memory report - skipping the memory comparison"
            exit 0
          fi
          uv run python -m scripts.compare_benchmark_runs \
            --base "${base_reports[@]}" \
            --head "$REPORT_DIR/$MEMORY_REPORT_FILENAME" \
            --metric memory \
            --markdown-out "$GITHUB_STEP_SUMMARY"

      # the whole directory, so the memory report and its chart export travel
      # with the timing report instead of needing artifacts of their own -
      # tests/test_benchmark_workflows.py pins the artifact count
      - name: Upload the benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-core-${{ matrix.repetition }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the merge base benchmark reports
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-base-${{ matrix.repetition }}
          path: ${{ env.BASE_REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14

  track:
    name: record trend
    needs: [measure]
    # master only: a trend point is a master commit, and a release branch's
    # rendering run produces no measurement for this job to record anyway.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      # push the updated benchmark data to the gh-pages branch
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the benchmark report
        uses: actions/download-artifact@v8
        with:
          name: benchmark-core-1
          path: benchmark-report

      # github-action-benchmark owns storage, charting, comparison and
      # alerting; what it charts is decided here.
      #
      # `customBiggerIsBetter` rather than `pytest`: that extractor tracks
      # `stats.ops` as `iter/sec` under the raw node id, and one "iteration" of
      # these benchmarks is a whole batch of 2,500 points - so the chart read
      # "183 iter/sec" for `test_timezone_at[random-in_memory]`, a number in no
      # unit anyone quotes and a name that says nothing about the workload.
      # scripts/export_timing_chart_json.py re-expresses the same tracked
      # measurement as lookups/sec under the labels the docs use.
      - name: Store the result and update the trend chart
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ${{ env.BENCHMARK_SUITE_NAME }}
          tool: customBiggerIsBetter
          output-file-path: benchmark-report/${{ env.CHART_FILENAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: ${{ env.ALERT_THRESHOLD }}
          # master must never be blocked by a benchmark result, and the
          # threshold is provisional besides
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          max-items-in-chart: 250

      # A second suite, not a second job: both steps push to `gh-pages`, so
      # they have to run in sequence within one job or they would race for the
      # same branch. `dev/bench/data.js` keys its entries by suite name, so the
      # two coexist and the page renders a chart for each.
      #
      # `customSmallerIsBetter`, the mirror of the timing chart above: a
      # footprint is the one metric here where a *rise* is the regression. See
      # scripts/export_memory_chart_json.py.
      - name: Store the memory footprint and update its trend chart
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ${{ env.MEMORY_SUITE_NAME }}
          tool: customSmallerIsBetter
          output-file-path: benchmark-report/${{ env.MEMORY_CHART_FILENAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: ${{ env.MEMORY_ALERT_THRESHOLD }}
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          max-items-in-chart: 250

  noise:
    name: report noise floor
    needs: [measure]
    if: github.event_name == 'workflow_dispatch' && !inputs.render_reports
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download every repetition
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-core-*
          path: noise-runs
          merge-multiple: false

      # each repetition ran on its own fresh runner, so this is the spread the
      # alert threshold actually has to clear - not just within-process jitter
      - name: Report the spread and the derived threshold
        run: |
          set -euo pipefail
          uv run python -m scripts.benchmark_noise \
            "noise-runs"/*/"$REPORT_FILENAME" \
            --markdown-out "$GITHUB_STEP_SUMMARY"

      # the same treatment for the footprint, and the only honest source for
      # MEMORY_ALERT_THRESHOLD: each repetition drew its own runner, so this
      # reports whether the charted heap metrics really are machine-independent
      - name: Report the memory spread and the derived threshold
        run: |
          set -euo pipefail
          uv run python -m scripts.benchmark_noise \
            "noise-runs"/*/"$MEMORY_REPORT_FILENAME" \
            --metric memory \
            --markdown-out "$GITHUB_STEP_SUMMARY"

  render-reports:
    name: render published benchmark reports
    # Two ways in. A push to a release branch is the ordinary one and needs no
    # human step; the manual dispatch stays for the two cases a push cannot
    # serve - re-rendering after the artifact of an unchanged release commit has
    # expired, and rendering the pages for a pull request that moves a measured
    # path outside a release.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.render_reports)
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install report dependencies
        run: uv sync --group test --group compare

      - name: Obtain the packaged boundary data
        uses: ./.github/actions/obtain-data
        with:
          token: ${{ github.token }}

      - name: Measure and render the published pages
        run: make reports

      - name: Stage reports bound to this commit
        run: |
          set -euo pipefail
          uv run python -m scripts.benchmark_report_artifact stage \
            --output-dir tmp/benchmark-pages \
            --commit "$GITHUB_SHA"

      - name: Upload the rendered pages
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-pages
          path: tmp/benchmark-pages/
          if-no-files-found: error
          retention-days: 90
