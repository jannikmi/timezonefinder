name: Auto-release data update PRs

# Full automation of data updates: when the CI/CD pipeline
# of an automated update PR (branch data-update-*, opened by
# check_data_updates.yml) completes:
# - on success: merge the PR and push the `data-v*` tag, which triggers the
#   publishing pipeline in publish_data.yml
# - on failure: label the PR and notify the maintainer
# - on a draft: neither. A green pipeline says the data is *valid*, never that it is
#   the data anybody meant to publish, and that second question belongs to the
#   data-update answer guard. When it refuses, check_data_updates.yml still prepares
#   the whole release and opens it as a draft, so the answers that moved are read as
#   an ordinary pull request diff; this workflow leaves it alone and says why.
#
# NOTE: merging and tagging use the GitHub App token, since tags pushed with
# the default GITHUB_TOKEN do not trigger other workflows.

on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  merge_and_release:
    name: Merge the update PR and tag the release
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'data-update-')
    runs-on: ubuntu-latest
    steps:
      # The same preflight the weekly update job runs, and for a sharper reason: this
      # workflow is triggered by `workflow_run`, so a failure here appears on no pull
      # request and in no issue - only in the Actions tab, where nothing draws a
      # maintainer. An absent credential would fail at the token step below, before
      # `resolve-update-pr` has found the pull request every notice in this job is
      # keyed to, so none of them can report it. Naming the cause in the log is all
      # that is left, and it is worth more than the third-party input error it
      # replaces, which names neither secret nor this repository.
      - name: Check that the data-updater App is configured
        env:
          # The expression, never the values: this yields 'true' or 'false', so no
          # credential reaches a shell where a trace or an error message could echo it.
          APP_CONFIGURED: >-
            ${{ secrets.DATA_UPDATER_GH_APP_ID != ''
            && secrets.DATA_UPDATER_GH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$APP_CONFIGURED" != "true" ]]; then
            echo "::error::the DATA_UPDATER_GH_APP_ID and DATA_UPDATER_GH_PRIVATE_KEY" \
              "repository secrets are not both set, so no data update can be merged" \
              "or tagged. Install a GitHub App on this repository with write access" \
              "to contents and pull requests, and store its App ID and private key" \
              "under those two names. The default GITHUB_TOKEN is deliberately not a" \
              "fallback: a tag it pushes triggers no workflow, so publish_data.yml" \
              "would never run and the merged update would never reach PyPI."
            exit 1
          fi
          echo "the data-updater App is configured"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DATA_UPDATER_GH_APP_ID }}
          private-key: ${{ secrets.DATA_UPDATER_GH_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out current master
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      # before the guard, because every later step needs the PR number -
      # including the ones that only run once the guard has failed
      - name: Resolve the update PR
        id: resolve-merge
        uses: ./.github/actions/resolve-update-pr
        with:
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          branch: ${{ github.event.workflow_run.head_branch }}
          head-sha: ${{ github.event.workflow_run.head_sha }}
          repo-owner: ${{ github.repository_owner }}
          repo: ${{ github.repository }}
          token: ${{ steps.app-token.outputs.token }}

      # The answer guard's refusal, read off the pull request rather than carried from
      # the run that opened it: this job is triggered by a *later* workflow_run and
      # shares no state with it. A draft is also the one refusal GitHub itself
      # enforces - `gh pr merge` on a draft is rejected - so this step decides whether
      # the maintainer is told politely, never whether the release is withheld.
      - name: Check whether the update is withheld for review
        if: steps.resolve-merge.outputs.found == 'true'
        id: withheld
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve-merge.outputs.pr-number }}
        run: |
          set -euo pipefail
          draft=$(gh pr view "$PR_NUMBER" --json isDraft --jq .isDraft)
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          if [[ "$draft" == "true" ]]; then
            echo "PR #$PR_NUMBER is a draft; it is not merged and nothing is published"
          fi

      - name: Ask the maintainer to review a withheld update
        if: >
          steps.resolve-merge.outputs.found == 'true' &&
          steps.withheld.outputs.draft == 'true'
        uses: ./.github/actions/notify-update-pr
        with:
          pr-number: ${{ steps.resolve-merge.outputs.pr-number }}
          marker: review-required
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: >
            @${{ github.repository_owner }} this automated data update passed CI but
            is a draft, so it was not merged and nothing was published. The data-update
            guard refused it, on the answers or on the payload sizes - which one is in
            this pull request's diff, not in this comment, because asserting the wrong
            signal is what talks a reviewer past a real refusal. Review
            `tests/fixtures/data_update/answers.txt`, one line per sampled point and
            the timezone it now resolves to, and `tests/fixtures/data_update/payload.json`,
            the compiled boundary and hole payload sizes. If the change is real, mark
            this ready for review and merge it; the `data-v*` tag is then pushed by hand
            from an up-to-date master.

      # Branch protection requires an up-to-date head, so master moving while an
      # update is in flight leaves a finished release needing a person to click
      # "Update branch" - which is the one manual step left in an otherwise unattended
      # pipeline, and it fell to the maintainer twice on the 2026d release alone.
      #
      # `mergeStateStatus` is the signal rather than a commit count, because it encodes
      # the protection setting: a behind branch reads BEHIND only where up-to-date is
      # actually required, and CLEAN otherwise. So this updates when the merge would be
      # refused and never merely because master moved. GitHub computes it
      # asynchronously, hence the poll on UNKNOWN - the same shape as the merge step's
      # wait for its merge commit below.
      #
      # The update is `gh pr update-branch`: a server-side merge, no checkout and no
      # force push, per the branch-update rules. It creates a new head, so CI re-runs
      # and *that* build's workflow_run fires this workflow again - which is the run
      # that merges. This step therefore ends the run rather than falling through to a
      # merge whose `--match-head-commit` names the commit the update just superseded.
      - name: Bring the update branch onto current master
        if: >
          steps.resolve-merge.outputs.found == 'true' &&
          steps.withheld.outputs.draft != 'true'
        id: update-branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve-merge.outputs.pr-number }}
        run: |
          set -euo pipefail

          state=""
          for attempt in $(seq 1 10); do
            state=$(gh pr view "$PR_NUMBER" --json mergeStateStatus \
              --jq .mergeStateStatus)
            if [[ "$state" != "UNKNOWN" ]]; then
              break
            fi
            echo "mergeability not computed yet (attempt $attempt), retrying"
            sleep 3
          done
          echo "merge state of PR #$PR_NUMBER: $state"

          if [[ "$state" != "BEHIND" ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr update-branch "$PR_NUMBER"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "merged master into the update branch; the new head re-runs CI and the" \
            "workflow_run for that build is what merges and tags this release"

      - name: Merge the update PR
        if: >
          steps.resolve-merge.outputs.found == 'true' &&
          steps.withheld.outputs.draft != 'true' &&
          steps.update-branch.outputs.updated != 'true'
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.resolve-merge.outputs.pr-number }}
        run: |
          set -euo pipefail

          checked_master=$(git rev-parse HEAD)
          current_master=$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq .object.sha)
          if [[ "$checked_master" != "$current_master" ]]; then
            echo "master moved after this run checked it out; refusing to merge"
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"

          # GitHub applies the squash asynchronously, so mergeCommit is null for
          # a moment afterwards and `--jq .mergeCommit.oid` would abort the step
          # under `set -e` with the PR already merged
          merge_sha=""
          for attempt in $(seq 1 10); do
            merge_sha=$(gh pr view "$PR_NUMBER" --json mergeCommit \
              --jq '.mergeCommit.oid // empty')
            if [[ -n "$merge_sha" ]]; then
              break
            fi
            echo "merge commit not reported yet (attempt $attempt), retrying"
            sleep 3
          done
          if [[ -z "$merge_sha" ]]; then
            echo "::error::PR #$PR_NUMBER merged but GitHub never reported its" \
              "merge commit - master carries the data update and no tag was pushed"
            exit 1
          fi

          # The check above compares master before the merge; the squash commit's
          # first parent is the master tip the merge actually applied to, which
          # settles after the fact that nothing landed in the window between them.
          # The merge itself is harmless and stands - what is withheld is the tag,
          # since that is what publishes.
          merge_parent=$(gh api "repos/$GH_REPO/commits/$merge_sha" \
            --jq '.parents[0].sha')
          if [[ "$merge_parent" != "$checked_master" ]]; then
            echo "::error::master moved from $checked_master to $merge_parent" \
              "while this run was merging - refusing to tag, since the release" \
              "was not built against the tree being tagged"
            exit 1
          fi

          echo "merged PR #$PR_NUMBER as $merge_sha"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      # one step per cause: the maintainer is told what actually happened,
      # rather than a disjunction of everything that could have
      - name: Report failed merge
        if: >
          failure() &&
          steps.resolve-merge.outputs.found == 'true' &&
          steps.merge.outcome == 'failure'
        uses: ./.github/actions/notify-update-pr
        with:
          pr-number: ${{ steps.resolve-merge.outputs.pr-number }}
          marker: merge-failed
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: >
            @${{ github.repository_owner }} this automated data update could not
            be merged and released
            ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).
            Check that run for the reason - a merge conflict, a change to
            master landing mid-merge, or a merge that went through without the
            release tag being pushed, which the log states explicitly.

      - uses: actions/checkout@v7
        if: steps.merge.outputs.merge_sha != ''
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.merge.outputs.merge_sha }}

      - name: Install uv
        if: steps.merge.outputs.merge_sha != ''
        uses: astral-sh/setup-uv@v7

      - name: Tag the release
        if: steps.merge.outputs.merge_sha != ''
        run: |
          set -euo pipefail

          # the *data* distribution's version, never the root's: a data update
          # changes no code, and a bare version tag is what releases
          # `timezonefinder` through build.yml. The two namespaces are what keep
          # this from publishing a code release (see .github/workflows/publish_data.yml)
          version=$(uv version --short --package timezonefinder-data)
          tag="data-v$version"
          # an annotated tag records a tagger, and a GitHub runner has no git
          # identity configured - git would refuse with "unable to auto-detect
          # email address", merging the data without ever publishing it
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # mirror the manual release process ("make release": annotated tag on master)
          git tag -a "$tag" -m "Data release $version"
          git push origin "$tag"
          echo "pushed release tag $tag, publish_data.yml takes over"

      # the merge cannot be undone, so a failure past it gets its own notice:
      # master already carries the data update and only the tag is missing.
      # `merge.outcome == 'success'` is what "past it" means - a failure inside
      # the merge step is the previous notice's, whichever side of `gh pr merge`
      # it fell on. This has to stay the last step in the job: a step appended
      # below it would fail without being reported, which is the hole this
      # closes. workflow_run failures show up on no pull request, so an
      # unreported one leaves nothing to notice anywhere the maintainer looks.
      - name: Report a merge that was not released
        if: >
          failure() &&
          steps.resolve-merge.outputs.found == 'true' &&
          steps.merge.outcome == 'success'
        uses: ./.github/actions/notify-update-pr
        with:
          pr-number: ${{ steps.resolve-merge.outputs.pr-number }}
          marker: merged-untagged
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: >
            @${{ github.repository_owner }} this automated data update was
            merged into master, but its release tag was never pushed
            ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).
            Nothing was published: master carries the new data and no release
            was built for it. Check that run for the reason, then push the
            `data-v<version>` tag by hand from an up-to-date master, which is
            the same tag this step would have pushed.

  alert_failure:
    name: Notify the maintainer about a failed update PR
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'data-update-')
    runs-on: ubuntu-latest
    steps:
      # the composite action below is a local `uses:`, so the repository has to
      # be in the workspace first. master, never the PR head - this job runs
      # code from it while a pull request is in flight.
      - name: Check out current master
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Resolve the update PR
        id: resolve-alert
        uses: ./.github/actions/resolve-update-pr
        with:
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          branch: ${{ github.event.workflow_run.head_branch }}
          head-sha: ${{ github.event.workflow_run.head_sha }}
          repo-owner: ${{ github.repository_owner }}
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Label the PR and mention the maintainer
        if: steps.resolve-alert.outputs.found == 'true'
        uses: ./.github/actions/notify-update-pr
        with:
          pr-number: ${{ steps.resolve-alert.outputs.pr-number }}
          marker: ci-failed
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: >
            @${{ github.repository_owner }} the CI/CD pipeline of this automated
            data update failed ([run](${{ github.event.workflow_run.html_url }})).
            Manual attention is needed; the PR will not be merged automatically.
