name: Paper draft

# compiles paper/paper.md into the PDF that JOSS would publish, so that each change to
# the paper can be proofread as rendered; it runs only when the paper changes
on:
  push:
    branches: [master]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Compile the JOSS paper draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload the draft PDF
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/paper.pdf
