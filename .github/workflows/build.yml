name: build

# Triggers:
# - push to master, version tags, or publishing a GitHub Release (fallback if a tag push did not start a run).
# A master push tests and stops; a version tag publishes and does not re-test. The tox
# matrix is the whole critical path (6-10 min per job, everything else under a minute),
# and a tag points at a commit already on master, so running it on both refs bought a
# second copy of the only expensive thing here. What makes the tag side sound is not the
# ancestry check - that proves the commit is on master, not that it was ever green - but
# the `release` job asserting that a successful `build` run for this exact SHA exists.
# GitHub limits: tag push webhooks are not emitted when more than three tags are pushed in one operation.
# Tag push runs use the workflow file as it exists in the commit the tag points to (the workflow must exist there).
#
# This repository has two tag namespaces: a bare version tag releases
# `timezonefinder`, and `data-v*` releases `timezonefinder-data` through
# publish_data.yml. Nothing here may publish on a `data-v*` ref, and that is enforced
# twice because there are two ways in. The tag filter below covers the push path - one
# line, in one place, impossible to half-apply. The `release: types: [published]` path
# is not a tag filter at all: `github.ref` is the tag, and publish_data.yml
# deliberately creates no GitHub Release, so this can only fire for a data tag if
# someone publishes one by hand. That is why the `release` job carries the ref guard as
# well; `publish-pypi` needs it, so skipping it skips the upload too.
#
# The name of this file is load-bearing: the trusted publisher on PyPI for
# `timezonefinder` names it, alongside this repository and the `pypi` deployment
# environment. Renaming it breaks publishing silently - PyPI simply refuses the OIDC
# identity, at tag-push time, when the release is already half out. A rename means
# updating the publisher on pypi.org in the same breath.
on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '**'
      - '!data-v*'
  release:
    types: [published]
  workflow_dispatch:

env:
  # Use one base Python version with future-proof abi3 support
  CIBW_BUILD_VERSIONS: "cp311-*"

jobs:
  pre-commit-hooks:
    name: run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run pre-commit hook
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    # Tag refs skip it: the tag names a commit already on master, whose push run tested
    # the identical tree. The `release` job checks that run exists rather than assuming it.
    if: "!startsWith(github.ref, 'refs/tags/')"
    strategy:
      # By default, GitHub will maximize the number of jobs run in parallel
      # depending on the available runners on GitHub-hosted virtual machines.
      # max-parallel: 8
      fail-fast: false
      matrix:
        # all officially supported Python versions should be tested
        # NOTE: need to match the versions in pyproject.toml > tox.ini
        # enforced by tests/test_python_version_support.py
        include:
          - python-version: "3.11"
            tox-env: "py311,py311-numba,py311-pytz"
          - python-version: "3.12"
            tox-env: "py312,py312-numba,py312-pytz,docs"
          - python-version: "3.13"
            tox-env: "py313,py313-numba,py313-pytz"
          - python-version: "3.14"
            tox-env: "py314,py314-numba,py314-pytz,slow"
    env:
      TOX_SKIP_MISSING_INTERPRETERS: False
    permissions:
      # `obtain-data` reads the artefacts of the run named by DATA_BUILD_RUN.
      # Declaring any permission zeroes every other one, so the checkout's read has to
      # be listed alongside it.
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install test dependencies
        run: uv sync --group test

      # The dataset is not in the checkout - it is obtained, and on a data-update pull
      # request it comes from the wheel that update's own run built rather than from
      # PyPI, which still serves the previous release. That is what keeps this matrix
      # the thing that validated the bytes the tag goes on to publish.
      - name: Obtain the packaged boundary data
        uses: ./.github/actions/obtain-data
        with:
          token: ${{ github.token }}

      - name: Run tox
        run: uv run tox -e ${{ matrix.tox-env }}

  make-wheels:
    name: Make ${{ matrix.os }} ${{ matrix.cibw_arch }} ${{ matrix.manylinux_tag }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # manylinux2014 (glibc >= 2.17) + musllinux
          - os: ubuntu-latest
            cibw_arch: native
            manylinux_image: quay.io/pypa/manylinux2014_x86_64:2026.04.25-0
            manylinux_tag: manylinux2014
            cibw_skip: ""
          # manylinux_2_28 (glibc >= 2.28)
          - os: ubuntu-latest
            cibw_arch: native
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64:2026.04.25-0
            manylinux_tag: manylinux_2_28
            cibw_skip: "*-musllinux*"
      fail-fast: false

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7

      - name: "Build wheels"
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: dist
        env:
          # https://github.com/pypa/cibuildwheel/blob/v3.4.1/cibuildwheel/resources/pinned_docker_images.cfg
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_MUSLLINUX_X86_64_IMAGE: quay.io/pypa/musllinux_1_1_x86_64:2024.10.26-1
          CIBW_BUILD: ${{ env.CIBW_BUILD_VERSIONS }}
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_SKIP: ${{ matrix.cibw_skip }}
          CIBW_BUILD_FRONTEND: pip
          CIBW_BUILD_VERBOSITY: 1

      - name: "Upload wheel as artifact"
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.os }}-${{ matrix.cibw_arch }}-${{ matrix.manylinux_tag }}-wheel
          path: "./**/dist/*.whl"

  make-sdist:
    name: Make source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - run: uv build -v --sdist

    - uses: actions/upload-artifact@v7
      with:
        name: artifact-source-dist
        path: "./**/dist/*.tar.gz"

  make-data-wheel:
    name: Make the data distribution wheel
    runs-on: ubuntu-latest
    permissions:
      # `obtain-data-wheel` reads the artefacts of the run named by DATA_BUILD_RUN.
      # Declaring any permission zeroes every other one, so the checkout's read has to
      # be listed alongside it.
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    # Not `uv build` here: on a data-update pull request the wheel this job hands the
    # end-to-end test has to be the same artefact the tag will publish, or "the matrix
    # validated what ships" is an inference about two builds rather than a fact. The
    # action falls back to building whenever no recorded run offers one, which is every
    # pull request that did not come out of the data pipeline.
    - name: Obtain the data wheel
      uses: ./.github/actions/obtain-data-wheel
      with:
        token: ${{ github.token }}

    - uses: actions/upload-artifact@v7
      with:
        name: artifact-data-wheel
        path: "./**/dist/timezonefinder_data-*.whl"

  end-to-end-test:
    runs-on: ubuntu-latest
    needs: [make-wheels, make-data-wheel]
    strategy:
        fail-fast: false
        matrix:
            uv-python-version: ["cp311", "cp312", "cp313", "cp314"]
    steps:
      # `uses: ./...` resolves from the workspace, so the staging action has to be on
      # disk. Sparse and non-cone deliberately: the test below builds a throwaway
      # project with `uv init` in the workspace root, and a full checkout would put
      # this repository's own pyproject.toml there - `uv init` refuses to overwrite
      # it, and uv would then resolve the e2e project against this workspace instead
      # of against the artefacts. Cone mode would materialise the root files too.
      - name: Check out the local actions only
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      # Only install uv without creating a project
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          ignore-empty-workdir: true

      - name: Stage artifacts in dist/
        uses: ./.github/actions/stage-artifacts

      - name: Run end-to-end test
        run: |
            find .
            uv init --name e2e --python ${{ matrix.uv-python-version }} --bare
            # both distributions from local artefacts, never the index: before the
            # first data release there is nothing to resolve there, and afterwards
            # resolving it would test a published dataset instead of this branch's
            uv add ./dist/timezonefinder_data-*.whl ./dist/timezonefinder-*manylinux_2_28*whl
            uv tree
            uv run python3 -c 'from timezonefinder import TimezoneFinder; tf = TimezoneFinder(); result = tf.timezone_at(lat=40.5, lng=11.7); assert(result == "Etc/GMT-1")'
            uv run python3 -c 'from timezonefinder.utils import clang_extension_loaded; assert(clang_extension_loaded)'

      # A wheel tagged manylinux_2_28 must actually be installable on it: the tag is a
      # claim pip believes, so a mis-tagged wheel is chosen and then fails at import.
      - name: Verify manylinux_2_28 wheel
        run: |
            pip download \
              --platform manylinux_2_28_x86_64 --python-version 3.14 --implementation cp \
              --only-binary :all: --no-index --find-links ./dist --no-deps -d /tmp/platform_test timezonefinder
            ls /tmp/platform_test/timezonefinder*manylinux_2_28*.whl

  release:
    name: Create release and publish to TestPyPI
    runs-on: ubuntu-latest
    # Note: only run, when test publishing worked
    needs: [test, make-wheels, make-sdist, end-to-end-test, pre-commit-hooks]
    # Tag refs only. A push to master used to reach this job too, and since the release
    # action is handed `tag:` it created the tag itself - so master's own run published,
    # and the maintainer's `git push` of the tag then raced it.
    # The verification steps below ensure tags are only released if on master, and only
    # if that master commit was tested green.
    # The `data-v*` exclusion repeats the trigger's tag filter because the
    # `release: types: [published]` trigger bypasses it (see the header). This job is
    # the one that must carry it: it creates the GitHub Release, and `publish-pypi`
    # needs it, so guarding here guards both.
    #
    # `!cancelled()` is load-bearing and so is everything after it: a skipped `needs`
    # job skips its dependents, and `test` is skipped on exactly the refs this job runs
    # on. Naming any status function also drops the implicit `success()` over `needs`,
    # which is why each job that does still run is checked by hand.
    if: >
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/') &&
      !startsWith(github.ref, 'refs/tags/data-v') &&
      needs.test.result != 'failure' &&
      needs.test.result != 'cancelled' &&
      needs['make-wheels'].result == 'success' &&
      needs['make-sdist'].result == 'success' &&
      needs['end-to-end-test'].result == 'success' &&
      needs['pre-commit-hooks'].result == 'success'
    permissions:
        # reading this commit's other workflow runs is what replaces re-running the
        # matrix; declaring any permission zeroes the rest, so it has to be listed
        actions: read
        id-token: write
        contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        # Fetch full history to check remote branches for verification.
        with:
          fetch-depth: 0

      # Verify that the commit is on the master branch to prevent releases from other branches.
      # This is crucial because tags can be pushed from any branch, but releases should only occur from master.
      - name: Verify commit is on master branch
        run: |
          if ! git branch -r --contains HEAD | grep -q origin/master; then
            echo "Tag is not on master branch. Aborting release."
            exit 1
          fi

      # The tox matrix does not run on this ref, so the fact that it passed has to come
      # from somewhere. The step above proves ancestry, which is not the same claim: a
      # commit can sit on master with a red run, or with no run at all. Assert the run
      # instead of inheriting the assumption - it is the difference between a check and
      # a belief, and it costs one API call against ten minutes of matrix.
      - name: Verify this commit tested green on master
        id: verify_tested_on_master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100" \
            --jq '[.workflow_runs[]
                   | select(.name == "build" and .head_branch == "master" and .conclusion == "success")]
                  | length')
          echo "successful master build runs for ${GITHUB_SHA}: ${green}"
          if [[ "${green}" -eq 0 ]]; then
            echo "No successful 'build' run on master for ${GITHUB_SHA}." >&2
            echo "The tag was pushed before master's run finished, or that run was red." >&2
            echo "Wait for it to pass, then re-run this job - do not re-tag." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Upgrade pip version
        run: pip install --upgrade pip

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Fetch version
        id: fetch_version
        run: echo "version_nr=$(uv version --short)" >> $GITHUB_OUTPUT

      - name: Stage artifacts in dist/
        uses: ./.github/actions/stage-artifacts

      # The two distributions release independently, and on a data format change the
      # order is fixed: data first, then the code requiring it. Backwards, the wheel is
      # uninstallable for everyone until the data lands - and PyPI never accepts a
      # version number twice, so the fix is a whole new release.
      #
      # It sits here rather than next to the upload in `publish-pypi` because the step
      # below is the first irreversible one: it publishes a GitHub Release, with the
      # wheels attached, and creates the tag. `publish-pypi` needs this job, so guarding
      # here guards the upload too. It needs no ref guard of its own any more: the job
      # is tag-only, so it can no longer turn master red for a release nobody is making.
      - name: Verify the required data version is published
        run: uv run --with packaging python -m scripts.check_data_dependency

      - name: Create GitHub Release
        id: create_gh_release
        uses: ncipollo/release-action@v1
        env:
          VERSION: ${{ steps.fetch_version.outputs.version_nr }}
        with:
          tag: ${{env.VERSION}}
          name: Release ${{env.VERSION}}
          draft: false
          prerelease: false
          skipIfReleaseExists: true
          # `timezonefinder-*`, not `timezonefinder*`: the latter also matches the
          # timezonefinder_data wheel, which is released under its own tag
          artifacts: "dist/timezonefinder-*.whl,dist/timezonefinder-*.tar.gz"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    # the environment the trusted publisher on PyPI is bound to; a run outside it gets
    # no OIDC identity PyPI will accept
    environment: pypi
    permissions:
      # required for Trusted Publishing: the job exchanges this for a short-lived
      # PyPI token, which is why no secret appears anywhere below
      id-token: write
    steps:
      # nothing here runs uv or pip - the publishing action brings its own
      # environment - so the checkout exists for one reason: `uses: ./...` resolves
      # from the workspace, and the staging action below has to be on disk
      - name: Checkout repo
        uses: actions/checkout@v7

      # the data wheel is deliberately left out of dist/: this job uploads whatever
      # is in it as `timezonefinder`, and publishing timezonefinder-data is
      # publish_data.yml's, on its own tag and its own trusted publisher
      - name: Stage artifacts in dist/
        uses: ./.github/actions/stage-artifacts
        with:
          include-data-wheel: "false"

      # no data-dependency check here: `release` runs it before the GitHub Release,
      # which is earlier and irreversible, and this job needs that one
      - name: PyPI Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
