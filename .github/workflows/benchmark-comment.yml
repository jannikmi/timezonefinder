name: benchmark-comment

# Posts the benchmark comparison for a pull request.
#
# Why this is a separate workflow:
# a PR from a fork gets a read-only GITHUB_TOKEN and no secrets, so the
# measuring job in benchmark.yml cannot comment - and it must not fail because
# of that. So benchmark.yml only measures and uploads artifacts (identical
# behaviour for fork and branch PRs), and this workflow does the privileged
# part.
#
# `workflow_run` workflows always execute the definition on the repository's
# default branch, never the PR's version, and check out no PR code at all.
# The only thing crossing the trust boundary is the benchmark JSON, which is
# read as data by scripts/compare_benchmark_runs.py - never executed, and the
# benchmark names it renders into the comment are sanitised there because they
# originate in the pull request. `pull_request_target` was rejected
# deliberately: it would run with write permissions in the same context as
# untrusted PR code, which is not a trade this project should make given it
# publishes to PyPI.
#
# What is compared: the pull request's head against *its own merge base*, both
# measured in the same benchmark.yml job on the same runner. The stored
# gh-pages baseline is deliberately NOT used - it was measured on a different
# machine, and `ubuntu-latest` does not pin the CPU (see benchmark.yml), so
# that comparison was dominated by which hardware each run happened to draw.
on:
  workflow_run:
    workflows: ["benchmark"]
    types: [completed]

permissions: {}

env:
  # must match REPORT_FILENAME in .github/workflows/benchmark.yml - the name
  # the head measurement is staged under inside its artifact. GitHub workflows
  # cannot import constants from each other, so this literal is duplicated;
  # tests/test_benchmark_workflows.py fails if the copies drift, as it does
  # for the artifact names below. The merge base's passes are consumed by
  # glob, so this workflow needs no constant for them.
  REPORT_FILENAME: "benchmark-report.json"
  # must likewise match MEMORY_REPORT_FILENAME in benchmark.yml. It rides in
  # the same two artifacts as the timing report rather than its own.
  MEMORY_REPORT_FILENAME: "memory-report.json"

jobs:
  comment:
    name: comment comparison
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      # checking out the base repository is all this needs - nothing writes to it
      contents: read
      # download the artifacts from the triggering workflow run
      actions: read
      # comment on the pull request's conversation. This was a commit comment
      # on the head commit first, on the assumption that those surface in the
      # conversation timeline. They do not: GitHub renders issue comments,
      # reviews and review comments there, and a commit comment appears only on
      # the commit's own page - so the job stayed green while the comparison
      # was invisible. A force push would orphan one besides. Do not move this
      # back to createCommitComment; tests/test_benchmark_workflows.py fails.
      # The same permission covers deleting the comment this workflow posted
      # on the previous push, which is how one table stays at the end of the
      # conversation instead of one edit staying at the top.
      pull-requests: write
    steps:
      # the base repo at its default branch - never the PR's code. The
      # comparison script that runs below is therefore always this
      # repository's version, not one the pull request could have edited.
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download the head measurement
        uses: actions/download-artifact@v8
        with:
          name: benchmark-core-1
          path: head-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the merge base measurement
        uses: actions/download-artifact@v8
        with:
          name: benchmark-base-1
          path: base-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # the script verifies that both sides really did come from one machine
      # rather than assuming it, and says so in the table it renders
      - name: Render the comparison
        run: |
          set -euo pipefail
          shopt -s nullglob
          # `pass-*` rather than `*`: the merge base artifact also carries its
          # memory report, which is compared separately below
          uv run python -m scripts.compare_benchmark_runs \
            --base base-report/pass-*.json \
            --head "head-report/$REPORT_FILENAME" \
            --markdown-out comparison.md
          # a merge base predating the memory harness has no report to compare
          # against; the timing table above still gets posted
          base_memory=(base-report/memory-pass-*.json)
          if [ ${#base_memory[@]} -gt 0 ]; then
            uv run python -m scripts.compare_benchmark_runs \
              --base "${base_memory[@]}" \
              --head "head-report/$MEMORY_REPORT_FILENAME" \
              --metric memory \
              --markdown-out comparison.md
          fi
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"

      # `head_sha` comes from the trusted workflow_run payload, not from the
      # artifact. jq builds the request body so the markdown is passed as JSON
      # data and can never be reinterpreted as gh arguments.
      - name: Comment the comparison on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # the run that measured what is compared above - this workflow's
          # own run only rendered it
          MEASUREMENT_RUN_URL: ${{ github.event.workflow_run.html_url }}
          # identifies this workflow's own comments among the pull request's,
          # so the superseded one can be found and removed. Without it each
          # push would leave another full table in the conversation.
          MARKER: "<!-- benchmark-comparison -->"
        run: |
          set -euo pipefail
          # The pull request number is resolved from the head SHA rather than
          # read from `workflow_run.pull_requests`: that array is empty for
          # fork pull requests, which are precisely the case this split
          # workflow exists to serve. A fork's head commit is reachable in the
          # base repository as `refs/pull/N/head`, so this endpoint resolves it.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
                 --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$pr" ]; then
            echo "::notice::no open pull request for $HEAD_SHA - nothing to comment on"
            exit 0
          fi
          # Which commit the table describes, stated in the table itself. It
          # is only ever as current as the push that produced it, and a reader
          # arriving mid-review has nothing else to check it against.
          {
            printf '%s\n\n' "$MARKER"
            printf '_Head [`%s`](%s/%s/commit/%s) - [measurement run](%s)._\n\n' \
              "${HEAD_SHA:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
              "$HEAD_SHA" "$MEASUREMENT_RUN_URL"
            cat comparison.md
          } > body.md
          jq -Rs '{body: .}' body.md > body.json
          # Posted anew and the previous one deleted, rather than edited in
          # place. A pull request's conversation orders by creation time and
          # an edit does not move a comment, so an edited table stays where
          # the pull request's first push left it - above every commit and
          # review comment made since, reading as a measurement of a head that
          # has been superseded, which is exactly what an out-of-date table
          # would look like too. Post first and delete after: the reverse
          # order leaves the pull request with no comparison at all whenever
          # the post fails.
          new_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --input body.json --jq '.id')
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --jq '.[]
                  | select(.user.login == "github-actions[bot]")
                  | select(.body | startswith(env.MARKER))
                  | .id' \
          | while read -r id; do
              if [ "$id" != "$new_id" ]; then
                # a run finishing alongside this one may have removed it
                # already, which is the state this wants either way
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
                  || echo "::notice::superseded comparison $id was already gone"
              fi
            done
