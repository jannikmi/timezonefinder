name: benchmark-comment

# Posts the benchmark comparison for a pull request.
#
# Why this is a separate workflow (issue #150's comments flag exactly this):
# a PR from a fork gets a read-only GITHUB_TOKEN and no secrets, so the
# measuring job in benchmark.yml cannot comment - and it must not fail because
# of that. So benchmark.yml only measures and uploads an artifact (identical
# behaviour for fork and branch PRs), and this workflow does the privileged
# part.
#
# `workflow_run` workflows always execute the definition on the repository's
# default branch, never the PR's version, and check out no PR code at all.
# The only thing crossing the trust boundary is the benchmark JSON, which is
# read as data by the benchmark action. `pull_request_target` was rejected
# deliberately: it would run with write permissions in the same context as
# untrusted PR code, which is not a trade this project should make given it
# publishes to PyPI.
on:
  workflow_run:
    workflows: ["benchmark"]
    types: [completed]

permissions: {}

env:
  # every constant below is duplicated from .github/workflows/benchmark.yml
  # because workflows cannot import constants from each other.
  # tests/test_benchmark_workflows.py enforces that the copies agree, so a
  # one-sided edit fails the test suite instead of silently comparing against
  # nothing.
  #
  # must match BENCHMARK_SUITE_NAME in .github/workflows/benchmark.yml - it is
  # the key the stored trend data is filed under, so a mismatch would compare
  # against nothing
  BENCHMARK_SUITE_NAME: "timezone lookup (clang, min)"
  # must match ALERT_THRESHOLD in .github/workflows/benchmark.yml, which
  # documents where the number comes from
  ALERT_THRESHOLD: "110%"
  # must match REPORT_FILENAME in .github/workflows/benchmark.yml
  REPORT_FILENAME: "benchmark-report.json"

jobs:
  comment:
    name: comment comparison
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      # createCommitComment (the action's fallback outside a pull_request
      # context) is a contents-scoped write
      contents: write
      # download an artifact from the triggering workflow run
      actions: read
    steps:
      # the base repo at its default branch - never the PR's code
      - uses: actions/checkout@v7

      - name: Download the benchmark report
        uses: actions/download-artifact@v8
        with:
          name: benchmark-core-1
          path: benchmark-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `ref` points the comparison and its comment at the PR's head commit
      # (taken from the trusted workflow_run payload, not from the artifact),
      # which is how the comment surfaces in the PR's conversation timeline.
      # `save-data-file: false` + `auto-push: false` keep PR measurements out
      # of the trend history: only master pushes write to it.
      - name: Compare against the master baseline and comment
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ${{ env.BENCHMARK_SUITE_NAME }}
          tool: pytest
          output-file-path: benchmark-report/${{ env.REPORT_FILENAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.workflow_run.head_sha }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: false
          save-data-file: false
          comment-always: true
          summary-always: true
          alert-threshold: ${{ env.ALERT_THRESHOLD }}
          # deliberately non-blocking until the trend chart confirms the
          # measured threshold holds over time: a noisy gate everyone learns
          # to ignore is worse than no gate. See CONTRIBUTING.md before
          # flipping this to true.
          fail-on-alert: false
