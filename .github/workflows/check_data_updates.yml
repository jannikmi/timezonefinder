name: Check for new timezone boundary data release

on:
  schedule:
    # weekly on Sunday at 00:00 UTC, like the reference workflows
    # (valhalla/valhalla check_tz_releases.yml, timezone-boundary-builder tz_update_check.yml)
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  check_data_version:
    name: Compare packaged data version with the latest upstream release
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.check.outputs.update_needed }}
      latest: ${{ steps.check.outputs.latest }}
      current: ${{ steps.check.outputs.current }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          current=$(cat DATA_VERSION)
          echo "packaged data version: $current"

          latest=$(curl --retry 3 -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: github-actions" \
            https://api.github.com/repos/evansiroky/timezone-boundary-builder/releases/latest \
            | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          if [[ -z "$latest" ]]; then
            echo "::warning::unable to determine the latest release tag from the GitHub API; skipping update check"
            echo "latest=" >> "$GITHUB_OUTPUT"
            echo "current=$current" >> "$GITHUB_OUTPUT"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$latest" =~ ^[0-9]{4}[a-z]+$ ]]; then
            echo "::error::unexpected release tag from the GitHub API: '$latest'"
            exit 1
          fi

          echo "latest available release: $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

          if [[ "$latest" == "$current" ]]; then
            echo "timezone boundary data is up to date"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # avoid duplicate work: skip if an update PR for this release is already open
          existing=$(gh pr list --repo "$GH_REPO" --state open --head "data-update-$latest" --json number --jq length)
          if [[ "$existing" -gt 0 ]]; then
            echo "an update PR for $latest is already open, nothing to do"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "update_needed=true" >> "$GITHUB_OUTPUT"

  open_update_pr:
    name: Regenerate the data and open an update PR
    needs: check_data_version
    if: needs.check_data_version.outputs.update_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LATEST: ${{ needs.check_data_version.outputs.latest }}
      CURRENT: ${{ needs.check_data_version.outputs.current }}
    steps:
      # Before the token step, because `create-github-app-token` reports an absent
      # credential as its own input error - "The 'client-id' (or deprecated 'app-id')
      # input must be set to a non-empty string" - naming neither secret, nor this
      # repository, nor what to do about it. The regeneration below never starts, and
      # the fallback job opens an issue asking a maintainer to compile the data by
      # hand, for a pipeline that is working. A secret this file names but the
      # repository does not carry reads exactly like one nobody ever created, which is
      # what the update to upstream `2026d` met: the credentials existed the whole
      # time, under other names.
      - name: Check that the data-updater App is configured
        env:
          # The expression, never the values: this yields 'true' or 'false', so no
          # credential reaches a shell where a trace or an error message could echo it.
          APP_CONFIGURED: >-
            ${{ secrets.DATA_UPDATER_GH_APP_ID != ''
            && secrets.DATA_UPDATER_GH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$APP_CONFIGURED" != "true" ]]; then
            echo "::error::the DATA_UPDATER_GH_APP_ID and DATA_UPDATER_GH_PRIVATE_KEY" \
              "repository secrets are not both set, so no data update can be" \
              "prepared. Install a GitHub App on this repository with write access" \
              "to contents and pull requests, and store its App ID and private key" \
              "under those two names. The default GITHUB_TOKEN is deliberately not a" \
              "fallback: a branch it pushes triggers no workflow, so the update pull" \
              "request would carry data that build.yml never validated and" \
              "release_data_update.yml could never merge."
            exit 1
          fi
          echo "the data-updater App is configured"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DATA_UPDATER_GH_APP_ID }}
          private-key: ${{ secrets.DATA_UPDATER_GH_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # NOTE: the App token (instead of the default GITHUB_TOKEN) is required so
      # that the push and the created PR trigger the regular CI/CD workflows
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Regenerate the data
        id: regenerate
        # the script now asks the release API twice - once for the tag, once for the
        # digest it verifies the download against - and an unauthenticated runner
        # shares its rate limit with everything else on its address
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # Exit 3 is update_data.sh's "prepared, but the data-update guard refused it". The
        # release is complete and gets committed and opened below exactly like any
        # other - as a draft, because the whole reason for preparing it is that a
        # person reads the answer diff. Every other non-zero exit produced nothing.
        run: |
          set +e
          bash update_data.sh --dataset=full --with-oceans --rm-tmp
          status=$?
          set -e
          if [[ "$status" -eq 3 ]]; then
            echo "the data-update guard refused this dataset; opening the update as a draft"
            echo "guard_refused=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

      # The wheel is built here, from the data this job just compiled, and every later
      # consumer reads *this* artefact: build.yml on the pull request opened below, and
      # publish_data.yml on the tag that merges it. publish_data.yml states in its own
      # header that it does not re-validate the data because build.yml checked it on the
      # pull request - which is only true while both are looking at one build. Two
      # builds agreeing is a claim about the converter being deterministic; one build is
      # the property itself.
      # dist/ is git-ignored, so this cannot reach the commit below.
      - name: Build the data wheel
        run: uv build -v --package timezonefinder-data --wheel -o dist/

      - name: Upload the data wheel
        uses: actions/upload-artifact@v7
        with:
          name: artifact-data-wheel
          path: dist/timezonefinder_data-*.whl

      # After the upload, never before it: the stamp's meaning is "run <id> holds the
      # wheel for this data", and a stamp written ahead of the upload would name a run
      # that has none whenever the upload fails. Before the commit, because the commit
      # is what carries it to the tag - update_data.sh cleared the previous release's
      # stamp, so a step that failed to write this one leaves no stamp rather than a
      # stale one.
      - name: Record the run that compiled the data
        run: echo "$GITHUB_RUN_ID" > DATA_BUILD_RUN

      # Explicit paths, not `git add -A`. The dataset itself is git-ignored, so `-A`
      # would already skip it - but "the update commits no binaries" would then be a
      # property of .gitignore rather than of this job, and a single un-ignored file
      # under the data directory would put ~62 MB into a branch that auto-merges.
      # Naming what an update writes also makes the reverse failure visible: the guard
      # below refuses to commit anything the script produced that this list forgot,
      # rather than dropping it and opening a pull request that is quietly incomplete.
      # It costs a whole regeneration to find out, though, so
      # tests/test_data_update_workflow.py holds this list against the generated-file
      # constants in scripts/configs.py, where a new report page appears first.
      - name: Commit and push the update branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "data-update-$LATEST"
          git add \
            DATA_VERSION \
            DATA_SOURCE \
            DATA_BUILD_RUN \
            packages/timezonefinder-data/pyproject.toml \
            packages/timezonefinder-data/README.md \
            tests/fixtures/benchmarks \
            tests/fixtures/data_update \
            tests/fixtures/reduced_zones \
            docs/benchmark_results_acceleration_paths.rst \
            docs/benchmark_results_batch_break_even.rst \
            docs/benchmark_results_comparison.rst \
            docs/benchmark_results_initialization.rst \
            docs/benchmark_results_memory.rst \
            docs/benchmark_results_polygon.rst \
            docs/benchmark_results_timezonefinding.rst \
            docs/batch_break_even_sweep.svg \
            docs/data_report.rst \
            uv.lock
          # Anything modified or untracked that the list above did not stage. A line
          # whose worktree column (the second character) is not a space is exactly
          # that, and `??` for an untracked file fails the same test.
          leftover=$(git status --porcelain --untracked-files=all | awk '$0 !~ /^[A-Z] /')
          if [[ -n "$leftover" ]]; then
            echo "::error::update_data.sh wrote files this job does not stage:"
            echo "$leftover"
            echo 'Add them to the staging list above, or ignore them deliberately.'
            exit 1
          fi
          git commit -m "Data $LATEST"
          # force push: a leftover branch from a previous failed run must not block the update
          git push --force origin "data-update-$LATEST"

      - name: Open the update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GUARD_REFUSED: ${{ steps.regenerate.outputs.guard_refused }}
        run: |
          set -euo pipefail
          # the data distribution's version - a data update bumps that one and
          # leaves `timezonefinder` alone
          new_version=$(uv version --short --package timezonefinder-data)
          body=$(cat <<EOF
          Automated update to the timezone-boundary-builder release [\`$LATEST\`](https://github.com/evansiroky/timezone-boundary-builder/releases/tag/$LATEST) (previously packaged: \`$CURRENT\`).

          The data was regenerated with \`update_data.sh\` (full dataset with oceans). Merging this publishes \`timezonefinder-data $new_version\`; no \`timezonefinder\` release is involved. The CI/CD pipeline of this PR validates the new data against all supported Python versions.

          Created by workflow run [#${GITHUB_RUN_ID}]($RUN_URL).
          EOF
          )

          # A draft is what withholds the release: release_data_update.yml skips one,
          # and GitHub refuses to merge one even if that check were removed. The
          # release itself is complete, so the answer diff is reviewed here rather
          # than reconstructed from a log - which is the whole reason the guard lets
          # the preparation finish.
          draft=()
          if [[ "${GUARD_REFUSED:-}" == "true" ]]; then
            draft=(--draft)
            body="$body

          > [!WARNING]
          > **The data-update guard refused this dataset, so this is a draft and will not be released automatically.** It gates on two signals, and which one tripped is visible in this pull request's own diff rather than asserted here - naming the wrong one would argue you out of a real refusal. \`tests/fixtures/data_update/answers.txt\` is one line per sampled point and the timezone it now resolves to, and a coordinate pastes straight back into \`timezone_at\`: more than 5 % of those 10,000 points moving is a refusal, where an ordinary refinement release moves none and the largest legitimate change measured was 0.380 %. \`tests/fixtures/data_update/payload.json\` is the compiled boundary and hole payload sizes: either moving outside its band is the other refusal, where four consecutive releases moved at most 1.38 % and 2.58 %. Mark this ready for review only if the change is real."
          fi

          gh pr create \
            --title "Data $LATEST" \
            --body "$body" \
            --head "data-update-$LATEST" \
            --base master \
            --reviewer "${{ github.repository_owner }}" \
            "${draft[@]}"
          echo "update PR created for $LATEST"

  open_notification_issue:
    # fallback: keep the previous behavior of opening a notification issue
    # in case the automated update could not be prepared
    name: Fall back to a notification issue
    needs: [check_data_version, open_update_pr]
    if: failure() && needs.check_data_version.outputs.update_needed == 'true'
    runs-on: ubuntu-latest
    env:
      LATEST: ${{ needs.check_data_version.outputs.latest }}
      CURRENT: ${{ needs.check_data_version.outputs.current }}
    steps:
      - name: Open notification issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The same expression the regeneration job's preflight reads. This issue is
          # where a scheduled failure is actually seen, and the two causes ask for
          # entirely different work: a broken pipeline needs the data compiled by hand,
          # while an unconfigured App needs two secrets and a re-run and nothing else.
          # Telling a maintainer to spend an afternoon on the converter because a
          # credential is missing is the specific waste this distinction prevents.
          APP_CONFIGURED: >-
            ${{ secrets.DATA_UPDATER_GH_APP_ID != ''
            && secrets.DATA_UPDATER_GH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail

          title="New timezone boundary data available: $LATEST"

          # avoid duplicate notifications: skip if an open issue already exists
          existing=$(gh issue list --state open --limit 100 --json title \
            --jq "[.[] | select(.title == \"$title\")] | length")
          if [[ "$existing" -gt 0 ]]; then
            echo "issue '$title' already exists, nothing to do"
            exit 0
          fi

          if [[ "$APP_CONFIGURED" == "true" ]]; then
            cause="The automated update job failed to prepare an update PR, so the data needs to be regenerated manually with \`update_data.sh\` (see \`contributing/development/data-pipeline-format-versioning-and-release-order.md\`)."
          else
            cause="The automated update job could not start: the \`DATA_UPDATER_GH_APP_ID\` and \`DATA_UPDATER_GH_PRIVATE_KEY\` repository secrets are not both set. The update branch is pushed with a GitHub App token because a branch pushed with the default \`GITHUB_TOKEN\` triggers no workflow, which would leave the pull request carrying data \`build.yml\` never validated and \`release_data_update.yml\` could never merge. Install a GitHub App on this repository with write access to contents and pull requests, store its App ID and private key under those two names - or, if the App already exists, check that its secrets are named exactly that - and re-run this workflow. The data does not need to be regenerated by hand. \`release_data_update.yml\` reads the same two secrets, so it is blocked on this as well."
          fi

          body=$(cat <<EOF
          A new timezone-boundary-builder release [\`$LATEST\`](https://github.com/evansiroky/timezone-boundary-builder/releases/tag/$LATEST) is available. The currently packaged data version is \`$CURRENT\`.

          $cause

          Created by workflow run [#${GITHUB_RUN_ID}]($RUN_URL).
          EOF
          )
          gh issue create --title "$title" --body "$body"
          echo "issue created: $title"
