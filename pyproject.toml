[project]
name = "timezonefinder"
version = "8.3.0"
description = "python package for finding the timezone of any point on earth (coordinates) offline"
authors = [{name = "jannikmi", email = "github@michelfe.it"}]
# Replace with license="MIT" with setuptools>=71
license = {file="LICENSE"}
readme = "README.rst"
keywords = ["timezone", "coordinates", "latitude", "longitude", "location", "offline", "polygon"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Localization",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# following the official NumPy support/deprecation schedule:
# https://numpy.org/neps/nep-0029-deprecation_policy.html#drop-schedule
# NOTE: When updating requires-python, also update the py_limited_api wheel config in setup.py
# (tests/test_python_version_support.py fails if the two, or the classifiers above, drift apart)
requires-python = ">=3.11,<4"
dependencies = [
    "numpy>=2",
    "h3>=4",
    "cffi<3,>=1.15.1",
    "flatbuffers>=25.2.10",
    # the packaged boundary data, split out so that a data update needs no code
    # release. The floor names the oldest dataset this code reads; the
    # ceiling is the *format* generation (timezonefinder.configs.DATA_FORMAT_VERSION,
    # the data version's major), so every future release of the current format keeps
    # satisfying it while a format change becomes a resolver error instead of a
    # failure at the first lookup. tests/test_data_version.py holds the two numbers
    # to the constant.
    "timezonefinder-data>=2.2026.3,<3",
]

[project.urls]
homepage = "https://timezonefinder.michelfe.it/gui"
repository = "https://github.com/jannikmi/timezonefinder"
documentation = "https://timezonefinder.readthedocs.io/en/latest/"

[project.scripts]
timezonefinder = "timezonefinder.command_line:main"

[dependency-groups]
docs = [
    "sphinx>=8,<10",
    "sphinx-rtd-theme>=3,<4",
]
test=[
    "tox",
    "pytest",
    "hypothesis>=6",
    # used in example scripts
    "pytz>=2022.7.1",
    # setuptools required for integration tests: building sdist and wheel.
    # Floor matches the build requirement below - the tests assert what it produces
    "setuptools>=62.3",
    "pytest-run-parallel>=0.8.2",
    # statistically sound benchmark measurement (calibration, warmup, outlier
    # detection); see benchmarks/. Never combine with pytest-run-parallel's
    # `--parallel-threads` in the same run - concurrent execution makes
    # timings meaningless (see
    # contributing/development/benchmarking-and-performance-validation.md)
    "pytest-benchmark>=5,<6",
    # parsing the CI workflow definitions in tests/test_benchmark_workflows.py
    "PyYAML>=6",
    # reading version specifiers and requirements: the tests that hold the
    # timezonefinder-data bound to DATA_FORMAT_VERSION, and the release guard in
    # scripts/check_data_dependency.py that build.yml runs with `--with packaging`
    "packaging>=23",
]
dev = [
    "pre-commit",
    "mypy",
    "rstcheck",
    "isort",
    "ruff",
    "cibuildwheel",
]
# data generation / parsing helpers
data = [
    "pydantic>=2.11.7",
]
# Numba requires NumPy 2.3.x or lower; pin here to avoid incompatible NumPy 2.4 installs
numba = [
  "numpy<2.4",
  "numba>=0.60,<1",
]
pytz = [
    "pytz>=2022.7.1"
]
# the alternative package docs/alternatives.rst weighs this one against,
# measured head-to-head by benchmarks/test_comparison.py. Deliberately its own
# group rather than part of `test`: the configuration CI tracks is
# `uv sync --group test` (.github/workflows/benchmark.yml), and that has to stay
# exactly what a plain `pip install timezonefinder` gives you. `make benchmarks`
# and `tox -e benchmarks` ask for this group explicitly; everything else runs
# without it, and the comparison benchmarks skip.
# It is a Rust extension shipping abi3 wheels for CPython 3.10+ on the platforms
# this project builds for; on one it does not cover, `make install` needs a Rust
# toolchain or `--no-group compare`, and nothing but the comparison is lost.
compare = [
    "tzfpy>=1,<2",
]
# prototyping, performance analytics
proto = [
    "line-profiler>=5.0.0",
    "pandas>=2.3.2",
    "matplotlib>=3.9.4",
    "seaborn>=0.13.2",
    "plotly>=6.3.0",
    "tabulate>=0.9.0",
]

# Package extras
[project.optional-dependencies]
# Numba requires NumPy 2.3.x or lower; pin here to avoid incompatible NumPy 2.4 installs
numba = [
  "numpy<2.4",
  "numba>=0.60,<1",
]
pytz = [
    "pytz>=2022.7.1"
]

# One repository, two distributions: `timezonefinder` (this project) and
# `timezonefinder-data` (the boundary data). The source declaration keeps a local
# checkout resolving to the workspace member rather than to PyPI, so the two are
# developed together while being released independently.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
timezonefinder-data = { workspace = true }

[build-system]
# 62.3: `**` in package-data below is only expanded recursively from that version on
requires = ["setuptools>=62.3", "cffi"]
# Use setuptools build backend to build CFFI extensions via setup.py
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "timezonefinder",
    "timezonefinder.inside_poly_extension",
    "timezonefinder.flatbuf",
    "timezonefinder.flatbuf.generated",
    "timezonefinder.flatbuf.generated.polygons",
    "timezonefinder.flatbuf.io",
    "timezonefinder.flatbuf.schemas",
]

# No data payload here any more - it ships in `timezonefinder-data`. What is left
# under `timezonefinder/` is the flatbuffers schemas and the C extension sources;
# tests/test_package_contents.py fails if a `.npy`/`.json` file reappears in this
# distribution. DATA_LICENSE moved with the database it covers, so there is no
# `[tool.setuptools.data-files]` entry left to declare.
[tool.setuptools.package-data]
timezonefinder = ["**/*.fbs", "**/*.c", "**/*.h", ]

# `**/*.c` above is meant for inside_poly_extension/, the hand-written extension
# sources. It also matches `inside_polygon_ext.c`, which is not a source at all: cffi
# generates it next to the package whenever the extension is compiled in place, and
# regenerates it during every wheel build. Without this exclusion a build performed in
# a tree where someone had compiled once ships that stale wrapper - which
# tests/test_package_contents.py already asserts must not happen, and which until now
# held only because a fresh checkout has no such file.
[tool.setuptools.exclude-package-data]
timezonefinder = ["inside_polygon_ext.c"]

[tool.ruff]
target-version = "py311"
src = ["timezonefinder", "tests", "build.py"]

[tool.ruff.lint.isort]
known-local-folder = ["timezonefinder"]

[tool.pytest.ini_options]
# excludes benchmarks/ (pytest-benchmark suites) from default collection: `make
# test`/`make testall` must not run or even collect them. `make benchmarks`
# passes the path explicitly, which overrides testpaths.
testpaths = ["tests"]
markers = [
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
    "parallel_threads_limit: mark test with a thread limit for parallel execution",
    "benchmark: mark a pytest-benchmark test (select the whole suite via `-m benchmark`); also accepts pytest-benchmark's own group/min_rounds/etc. kwargs",
    "benchmark_core: mark a benchmark as part of the small, CI-tracked core subset (see .github/workflows/benchmark.yml) - pick for signal, not coverage",
]

[tool.rstcheck]
# Read by the pre-commit hook and by a bare `rstcheck` run alike, so the two agree.
# docs/ is Sphinx-built and rstcheck only recognises the directives Sphinx owns when sphinx
# is installed, which the hook pulls in. Three directives still need naming here:
#   autoclass/autofunction - autodoc is not part of that shim
#   include - rstcheck resolves it against the working directory rather than against the
#     including file, and abandons the whole file with an AttributeError when it misses.
#     Both include targets (docs/badges.rst, CHANGELOG.rst) are linted directly, so skipping
#     the directive covers the same content without the false negative.
ignore_directives = ["autoclass", "autofunction", "include"]
# INFO findings are Sphinx facts, not defects: hyperlink targets referenced from another page,
# and headings that legitimately repeat across pages.
report_level = "warning"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Ignore missing stubs for third-party libraries
[[tool.mypy.overrides]]
module = [
    "flatbuffers",
    "flatbuffers.*",
    "numba",
    "numba.*",
    "h3",
    "h3.*",
    "cpuinfo",
]
ignore_missing_imports = true

# Ignore generated files. `flatc` output is not written by hand and is
# regenerated by `make flatbuf`, so type errors in it are not actionable here.
# Keep this list minimal: every module named below is one whose type errors CI
# will not report - see tests/test_mypy_config.py.
[[tool.mypy.overrides]]
module = [
    "timezonefinder.flatbuf.generated.*",
]
ignore_errors = true

# Allow Any for complex numpy dtype cases
[[tool.mypy.overrides]]
module = [
    "timezonefinder.configs",
]
allow_any_generics = true

# Use abi3audit to check wheel abi3 conformance
# A first line in command is a default value
[tool.cibuildwheel.linux]
repair-wheel-command = [
  "auditwheel repair -w {dest_dir} {wheel}",
  "uvx abi3audit --strict --summary {wheel}",
]
[tool.cibuildwheel.macos]
repair-wheel-command = [
  "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}",
  "uvx abi3audit --strict --summary {wheel}",
]
[tool.cibuildwheel.windows]
repair-wheel-command = [
  "copy {wheel} {dest_dir}",
  "uvx abi3audit --strict --summary {wheel}",
]

# Install build dependencies per container type
[[tool.cibuildwheel.overrides]]
select = "cp*-manylinux*"
before-all = "yum install -y libffi-devel"

[[tool.cibuildwheel.overrides]]
select = "cp*-musllinux*"
before-all = "apk add --no-cache libffi-dev"

[[tool.cibuildwheel.overrides]]
select = "*"
inherit.environment = "append"
environment.BUILD_ABI3 = "true"
