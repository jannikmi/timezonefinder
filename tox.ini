[tox]
isolated_build = true
envlist =
    slow,docs,py{311,312,313,314}{,-numba,-pytz},py311-min

# The oldest NumPy release that satisfies this package's declared `numpy>=2` and has
# wheels for the lowest supported interpreter. Stated once here and read from
# `[testenv:py311-min]` below; tests/test_python_version_support.py holds it to the
# lower bound declared in pyproject.toml, so raising or lowering that bound without
# moving this pin fails rather than leaving the compatibility claim untested.
[min-deps]
numpy = 2.0.0

[testenv]
allowlist_externals = uv
# `timezonefinder` requires the `timezonefinder-data` distribution, and tox installs
# the package with bare pip - which resolves that requirement from PyPI, where this
# checkout's version need not exist (it does not at all before the first data
# release). Installing the workspace member from the source tree satisfies it, and
# keeps every env testing the data this checkout carries rather than a published one.
deps =
    {toxinidir}/packages/timezonefinder-data
# example tests run in all environments; scripts requiring pytz are skipped when pytz is unavailable
commands =
    !numba: uv run -v pytest  -m "not integration and not slow" {posargs}
    numba:  uv run -v --group numba pytest -m "not integration and not slow" {posargs}
    pytz:   uv run -v --group pytz pytest  -m "not integration and not slow" {posargs}


[testenv:slow]
description = run slow tests only
# run expensive tests only once (include integration tests)
basepython = python3.14
allowlist_externals = uv
commands =
    uv run -v pytest -m "slow or integration" {posargs}

[testenv:benchmarks]
description = run the pytest-benchmark suite (not part of the default envlist - run explicitly: `tox -e benchmarks`)
basepython = python3.14
allowlist_externals = uv
# --group compare pulls in the alternative package benchmarks/test_comparison.py
# measures against; without it those benchmarks skip (see the Makefile).
commands =
    uv run -v --group compare pytest benchmarks -m benchmark --benchmark-json="{toxworkdir}{/}benchmark.json" {posargs}

[testenv:docs]
description = build documentation
basepython = python3.12
allowlist_externals = uv,sphinx-build
commands =
    uv run -v --group docs python3 --version
    sphinx-build -d "{envtmpdir}{/}doctree" docs "{toxworkdir}{/}docs_out" --color -b html
    python -c 'print(r"documentation available under file://{toxworkdir}{/}docs_out{/}index.html")'


[testenv:py311-min]
description = run the test suite against the oldest supported NumPy release
# 3.11 is the lowest supported interpreter and therefore the only one the declared
# floor can be exercised on: NumPy 2.0.0 ships no wheels for 3.13+ (3.13 needs 2.1,
# 3.14 needs 2.3), so a `-min` env for a newer interpreter would test a NumPy this
# package never claimed as its minimum. The floor is one bound with no environment
# markers, so this single env covers the whole claim; the ordinary py3XY envs cover
# the current end of the supported range.
basepython = python3.11
allowlist_externals = uv
deps = {[testenv]deps}
# `--with` overlays the pin on the environment the ordinary envs resolve, so nothing
# else is pinned to a textual minimum and only the dependency under test moves. The
# first command fails the env if the resolver did not actually place that version -
# without it a silently ignored pin would leave a green env testing whatever NumPy
# happened to be installed, which is the one failure mode this env exists to rule out.
commands =
    uv run -v --with numpy=={[min-deps]numpy} python -c "import numpy; assert numpy.__version__ == '{[min-deps]numpy}', 'expected numpy {[min-deps]numpy}, got ' + numpy.__version__"
    uv run -v --with numpy=={[min-deps]numpy} pytest -m "not integration and not slow" {posargs}
