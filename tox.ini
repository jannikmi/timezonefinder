[tox]
isolated_build = true
envlist =
    slow,docs,py{311,312,313,314}{,-numba,-pytz}

[testenv]
allowlist_externals = uv
# `timezonefinder` requires the `timezonefinder-data` distribution, and tox installs
# the package with bare pip - which resolves that requirement from PyPI, where this
# checkout's version need not exist (it does not at all before the first data
# release). Installing the workspace member from the source tree satisfies it, and
# keeps every env testing the data this checkout carries rather than a published one.
deps =
    {toxinidir}/packages/timezonefinder-data
# example tests run in all environments; scripts requiring pytz are skipped when pytz is unavailable
commands =
    !numba: uv run -v pytest  -m "not integration and not slow" {posargs}
    numba:  uv run -v --group numba pytest -m "not integration and not slow" {posargs}
    pytz:   uv run -v --group pytz pytest  -m "not integration and not slow" {posargs}


[testenv:slow]
description = run slow tests only
# run expensive tests only once (include integration tests)
basepython = python3.14
allowlist_externals = uv
commands =
    uv run -v pytest -m "slow or integration" {posargs}

[testenv:benchmarks]
description = run the pytest-benchmark suite (not part of the default envlist - run explicitly: `tox -e benchmarks`)
basepython = python3.14
allowlist_externals = uv
# --group compare pulls in the alternative package benchmarks/test_comparison.py
# measures against; without it those benchmarks skip (see the Makefile).
commands =
    uv run -v --group compare pytest benchmarks -m benchmark --benchmark-json="{toxworkdir}{/}benchmark.json" {posargs}

[testenv:docs]
description = build documentation
basepython = python3.12
allowlist_externals = uv,sphinx-build
commands =
    uv run -v --group docs python3 --version
    sphinx-build -d "{envtmpdir}{/}doctree" docs "{toxworkdir}{/}docs_out" --color -b html
    python -c 'print(r"documentation available under file://{toxworkdir}{/}docs_out{/}index.html")'
