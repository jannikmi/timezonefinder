repos:
    -   repo: https://github.com/pre-commit/pre-commit-hooks
        rev: v6.0.0
        hooks:
            -   id: check-ast  # Is it valid Python?
            -   id: debug-statements # no debbuging statements used
            -   id: trailing-whitespace
            -   id: end-of-file-fixer
            -   id: check-yaml
            -   id: check-added-large-files
                # The packaged dataset is git-ignored and normally never staged at all.
                # The exemption covers the deliberate exception: a branch regenerating
                # the data under a version PyPI cannot serve yet has to `git add -f` it
                # so CI has something to test, and every file under here is package
                # data whose size is the format's business rather than this hook's.
                exclude: ^packages/timezonefinder-data/timezonefinder_data/data/
            -   id: check-case-conflict
            -   id: check-json
            -   id: pretty-format-json
                args: [ "--autofix" ]
            -   id: check-merge-conflict
            -   id: check-docstring-first
            -   id: requirements-txt-fixer
            -   id: detect-private-key


    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.21
      hooks:
          - id: ruff
            # linter.
            args: [ --fix ]
            exclude: ^(prototypes/)
          - id: ruff-format

    -   repo: https://github.com/asottile/blacken-docs
        rev: 1.20.0
        hooks:
            -   id: blacken-docs

    -   repo: https://github.com/myint/rstcheck
        rev: 'v6.2.5'
        hooks:
            # Covers docs/ as well as README.rst and CHANGELOG.rst. Sphinx is installed into
            # the hook environment so that rstcheck recognises the directives it owns
            # (toctree, automodule, ...); without it every one of them reads as an unknown
            # directive and docs/ has to be excluded, which is how a note running into the
            # bullet list below it survived in docs/data_format.rst - rstcheck reports that
            # one, only nothing was pointing it at the file. Configured in pyproject.toml
            # under [tool.rstcheck], which a bare `rstcheck` run picks up as well.
            -   id: rstcheck
                additional_dependencies: ["sphinx"]

    -   repo: https://github.com/abravalheri/validate-pyproject
        rev: v0.25
        hooks:
            -   id: validate-pyproject

    -   repo: https://github.com/asottile/pyupgrade
        rev: v3.21.2
        hooks:
            -   id: pyupgrade

    -   repo: https://github.com/pre-commit/mirrors-mypy
        rev: v2.2.0
        hooks:
            -   id: mypy
                exclude: ^((prototypes|docs|benchmarks)/)
                # the stubs for every third-party import the checked code makes: this
                # hook runs in its own environment, so a package being installed for
                # the test suite says nothing about mypy being able to see it here
                additional_dependencies: [types-pytz, types-cffi, types-PyYAML]

    -   repo: https://github.com/mgedmin/check-manifest
        rev: "0.51"
        hooks:
            -   id: check-manifest
                # DATA_BUILD_RUN is CI provenance written by the data-update workflow (see
                # scripts/configs.py): it belongs in the repository and in no sdist, and
                # it appears only after a data update, so the ignore has to be here before
                # the first one rather than added by it
                args: [ "--no-build-isolation", "--ignore",  ".*,.*/*,docs/*,examples/*,scripts/*,benchmarks/*,packages/*,*.sh,CHANGELOG.rst,Makefile,readthedocs.yml,uv.lock,tox.ini,DATA_BUILD_RUN" ]
                additional_dependencies: [ numpy, uv, cffi ]

    -   repo: https://github.com/pre-commit/mirrors-clang-format
        rev: v22.1.5
        hooks:
            -   id: clang-format
