<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="How often timezonefinder and tzfpy return a different zone, against distance from the nearest timezone border">
<rect width="800" height="440" fill="#ffffff"/>
<text x="84" y="32" font-size="17" font-weight="600" fill="#28323a">Where timezonefinder and tzfpy stop agreeing</text>
<text x="84" y="52" font-size="12.5" fill="#6b7a85">boundary release 2026c on both sides, tzfpy 1.3.3, 20000 points per distance; both axes logarithmic</text>
