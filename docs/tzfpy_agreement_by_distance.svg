<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="How often timezonefinder and tzfpy return a different zone, against distance from the nearest timezone border">
<rect width="780" height="420" fill="#ffffff"/>
<text x="76" y="32" font-size="17" font-weight="600" fill="#28323a">Where timezonefinder and tzfpy stop agreeing</text>
<text x="76" y="52" font-size="12.5" fill="#6b7a85">boundary release 2026c on both sides, tzfpy 1.3.3, 2000 points per distance</text>
<line x1="76" y1="72" x2="102" y2="72" stroke="#1f6feb" stroke-width="2.4"/>
<text x="110" y="76" font-size="12.5" fill="#28323a">any timezone border</text>
<line x1="286" y1="72" x2="312" y2="72" stroke="#c2570f" stroke-width="2.4" stroke-dasharray="7 5"/>
<text x="320" y="76" font-size="12.5" fill="#28323a">border of a land zone</text>
<line x1="76" y1="358.0" x2="750" y2="358.0" stroke="#dde3e8" stroke-width="1"/>
<text x="66" y="362.0" font-size="12" text-anchor="end" fill="#6b7a85">0%</text>
<line x1="76" y1="305.6" x2="750" y2="305.6" stroke="#dde3e8" stroke-width="1"/>
<text x="66" y="309.6" font-size="12" text-anchor="end" fill="#6b7a85">10%</text>
<line x1="76" y1="253.2" x2="750" y2="253.2" stroke="#dde3e8" stroke-width="1"/>
<text x="66" y="257.2" font-size="12" text-anchor="end" fill="#6b7a85">20%</text>
<line x1="76" y1="200.8" x2="750" y2="200.8" stroke="#dde3e8" stroke-width="1"/>
<text x="66" y="204.8" font-size="12" text-anchor="end" fill="#6b7a85">30%</text>
<line x1="76" y1="148.4" x2="750" y2="148.4" stroke="#dde3e8" stroke-width="1"/>
<text x="66" y="152.4" font-size="12" text-anchor="end" fill="#6b7a85">40%</text>
<line x1="76" y1="96.0" x2="750" y2="96.0" stroke="#dde3e8" stroke-width="1"/>
<text x="66" y="100.0" font-size="12" text-anchor="end" fill="#6b7a85">50%</text>
<line x1="76.0" y1="358.0" x2="76.0" y2="363.0" stroke="#6b7a85" stroke-width="1"/>
<text x="76.0" y="380.0" font-size="12.5" text-anchor="middle" fill="#28323a">1 cm</text>
<line x1="244.5" y1="358.0" x2="244.5" y2="363.0" stroke="#6b7a85" stroke-width="1"/>
<text x="244.5" y="380.0" font-size="12.5" text-anchor="middle" fill="#28323a">10 cm</text>
<line x1="413.0" y1="358.0" x2="413.0" y2="363.0" stroke="#6b7a85" stroke-width="1"/>
<text x="413.0" y="380.0" font-size="12.5" text-anchor="middle" fill="#28323a">1 m</text>
<line x1="581.5" y1="358.0" x2="581.5" y2="363.0" stroke="#6b7a85" stroke-width="1"/>
<text x="581.5" y="380.0" font-size="12.5" text-anchor="middle" fill="#28323a">10 m</text>
<line x1="750.0" y1="358.0" x2="750.0" y2="363.0" stroke="#6b7a85" stroke-width="1"/>
<text x="750.0" y="380.0" font-size="12.5" text-anchor="middle" fill="#28323a">100 m</text>
<polyline points="76.0,160.2 244.5,190.1 413.0,219.1 581.5,259.5 750.0,358.0" fill="none" stroke="#1f6feb" stroke-width="2.4" stroke-linejoin="round"/>
<circle cx="76.0" cy="160.2" r="4" fill="#1f6feb"/>
<text x="76.0" y="180.2" font-size="12" text-anchor="start" fill="#1f6feb">37.8%</text>
<circle cx="244.5" cy="190.1" r="4" fill="#1f6feb"/>
<text x="244.5" y="210.1" font-size="12" text-anchor="middle" fill="#1f6feb">32.0%</text>
<circle cx="413.0" cy="219.1" r="4" fill="#1f6feb"/>
<text x="413.0" y="239.1" font-size="12" text-anchor="middle" fill="#1f6feb">26.5%</text>
<circle cx="581.5" cy="259.5" r="4" fill="#1f6feb"/>
<text x="581.5" y="279.5" font-size="12" text-anchor="middle" fill="#1f6feb">18.8%</text>
<circle cx="750.0" cy="358.0" r="4" fill="#1f6feb"/>
<polyline points="76.0,107.3 244.5,133.1 413.0,170.6 581.5,229.2 750.0,358.0" fill="none" stroke="#c2570f" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="7 5"/>
<circle cx="76.0" cy="107.3" r="4" fill="#c2570f"/>
<text x="76.0" y="94.3" font-size="12" text-anchor="start" fill="#c2570f">47.8%</text>
<circle cx="244.5" cy="133.1" r="4" fill="#c2570f"/>
<text x="244.5" y="120.1" font-size="12" text-anchor="middle" fill="#c2570f">42.9%</text>
<circle cx="413.0" cy="170.6" r="4" fill="#c2570f"/>
<text x="413.0" y="157.6" font-size="12" text-anchor="middle" fill="#c2570f">35.8%</text>
<circle cx="581.5" cy="229.2" r="4" fill="#c2570f"/>
<text x="581.5" y="216.2" font-size="12" text-anchor="middle" fill="#c2570f">24.6%</text>
<circle cx="750.0" cy="358.0" r="4" fill="#c2570f"/>
<text x="413" y="404.0" font-size="12.5" text-anchor="middle" fill="#6b7a85">distance from the nearest timezone border (logarithmic)</text>
<text x="20" y="227" font-size="12.5" text-anchor="middle" fill="#6b7a85" transform="rotate(-90 20 227)">a different zone returned</text>
</svg>
